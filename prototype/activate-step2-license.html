<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维中心 · 初始化 · 设备激活配置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; color: #333; background: #eef0f3; }
  .topbar { height: 50px; background: #1a6cfb; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .topbar .logo { font-size: 18px; }
  .topbar .right { display: flex; align-items: center; gap: 28px; }
  .topbar .entry, .topbar .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .topbar .ico { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #1a6cfb; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
  .titlebar { height: 42px; background: #fff; display: flex; align-items: center; padding: 0 22px; border-bottom: 1px solid #eee; }
  .titlebar .back { font-size: 18px; margin-right: 18px; cursor: pointer; }
  .titlebar h1 { font-size: 17px; font-weight: bold; }
  .steps { background: #fff; display: flex; height: 56px; border-bottom: 1px solid #e6e6e6; }
  .step { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; color: #999; position: relative; font-size: 15px; }
  .step:not(:last-child)::after { content: "›"; position: absolute; right: 0; font-size: 22px; color: #bbb; }
  .step .num { width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; color: #666; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .step.done { color: #333; }
  .step.done .num, .step.active .num { background: #1a6cfb; color: #fff; }
  .step.active { color: #333; border-bottom: 2px solid #1a6cfb; }
  .card { max-width: 1320px; margin: 20px auto 30px; background: #fff; padding: 60px 0 50px; min-height: 760px; }
  .form { width: 640px; margin: 0 auto; }
  .row { display: flex; align-items: flex-start; margin-bottom: 26px; }
  .row label { width: 150px; text-align: right; padding: 7px 10px 0 0; flex-shrink: 0; }
  .row .ctrl { flex: 1; position: relative; }
  .hint { color: #666; font-size: 13px; margin-top: 8px; }
  .btn { height: 36px; padding: 0 30px; border-radius: 4px; border: none; background: #1a6cfb; color: #fff; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #3d82ff; }
  .btn.sm { height: 34px; padding: 0 18px; }
  .btn.ghost { background: #fff; color: #333; border: 1px solid #d9d9d9; }
  .btn.ghost:hover { color: #1a6cfb; border-color: #1a6cfb; background: #fff; }
  .btn:disabled, .btn:disabled:hover { background: #f5f5f5; color: #bbb; border: 1px solid #e5e5e5; cursor: not-allowed; }
  .footer { text-align: center; margin-top: 40px; display: flex; justify-content: center; gap: 12px; }
  /* 授权文件上传区 */
  .drop { width: 300px; height: 150px; border: 1px dashed #1a6cfb; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; background: radial-gradient(ellipse at 50% 110%, #eaf1ff 0, #eaf1ff 45%, #fff 46%); transition: .2s; }
  .drop:hover { background-color: #f7faff; border-color: #3d82ff; }
  .drop .folder { width: 64px; height: 46px; border-radius: 6px; background: linear-gradient(#a9c6ff, #7ea8fb); color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; }
  .drop.busy { cursor: wait; border-color: #d9d9d9; }
  .drop.bad { border-color: #e4393c; }
  .err-msg { color: #e4393c; font-size: 12px; margin-top: 6px; min-height: 18px; }
  /* 设备激活信息 */
  .info { width: 600px; margin: 0 auto; }
  .info .bar { height: 36px; line-height: 36px; padding-left: 16px; border-radius: 4px; color: #fff; font-weight: bold; font-size: 15px; background: linear-gradient(90deg, #1a6cfb, #a9c6ff 70%, #e8f0ff); position: relative; }
  .info .bar .dot { position: absolute; right: -32px; top: 8px; }
  .info ul { list-style: none; padding: 18px 30px; line-height: 2.1; }
  /* PRD 标注点 */
  .dot { position: absolute; right: -32px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: #ff7a00; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; border: none; animation: pulse 1.8s infinite; }
  .dot.inline { position: relative; right: auto; top: auto; transform: none; display: inline-flex; margin-left: 10px; vertical-align: middle; }
  .info .bar .dot { transform: none; }
  .dot.open { background: #1a6cfb; animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,122,0,.55); } 70% { box-shadow: 0 0 0 9px rgba(255,122,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,122,0,0); } }
  body.hide-dots .dot { display: none !important; }
  .pop { position: absolute; width: 380px; background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 50; font-size: 13px; line-height: 1.7; display: none; }
  .pop.show { display: block; }
  .pop .hd { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
  .pop .hd .close { cursor: pointer; color: #999; font-weight: normal; }
  .pop .bd { padding: 10px 14px 12px; max-height: 440px; overflow: auto; }
  .note { padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; }
  .note:last-child { margin-bottom: 0; }
  .note .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; margin-right: 6px; background: rgba(255,255,255,.75); }
  .note .ver { float: right; font-size: 11px; color: #888; }
  .note.rule { background: #fff6c2; border-left: 3px solid #ffdf25; }
  .note.change { background: #ffffd6; border-left: 3px solid #e6e600; }
  .note.draft { background: #fff1f0; border-left: 3px solid #ff7875; }
  .ctrl-panel { position: fixed; left: 20px; bottom: 20px; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 14px; font-size: 13px; z-index: 60; display: flex; align-items: center; gap: 12px; }
  .ctrl-panel a { color: #1a6cfb; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; background: #1a6cfb; border-radius: 10px; cursor: pointer; transition: .2s; }
  .switch::after { content: ""; position: absolute; left: 18px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch.off { background: #ccc; }
  .switch.off::after { left: 2px; }
  .seg button { border: 1px solid #d9d9d9; background: #fff; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  .seg button + button { border-left: none; }
  .seg button.on { background: #1a6cfb; color: #fff; border-color: #1a6cfb; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 22px; border-radius: 4px; display: none; z-index: 99; max-width: 560px; text-align: center; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 80; }
  .mask.open { display: flex; }
  .modal { background: #fff; border-radius: 6px; width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .modal .mhd { padding: 14px 20px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }
  .modal .mhd .close { cursor: pointer; color: #999; font-weight: normal; }
  .modal .mbd { padding: 18px 20px; line-height: 1.8; }
  .modal .mft { padding: 10px 20px 16px; text-align: right; }
  .modal .mft .btn { padding: 0 20px; margin-left: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">运维中心</div>
  <div class="right">
    <div class="entry"><span class="ico">⌂</span>功能入口</div>
    <div class="user"><span class="ico">A</span>admin ▾</div>
  </div>
</div>

<div class="titlebar">
  <span class="back" id="btnBack" title="返回">←</span>
  <h1>初始化</h1>
</div>

<div class="steps">
  <div class="step done"><span class="num">1</span>网络信息配置</div>
  <div class="step active"><span class="num">2</span>设备激活配置</div>
  <div class="step"><span class="num">3</span>基础服务配置</div>
  <div class="step"><span class="num">4</span>项目信息配置</div>
  <div class="step"><span class="num">5</span>可选服务配置</div>
  <div class="step"><span class="num">6</span>系统初始化</div>
</div>

<div class="card">
  <!-- 状态一：下载激活文件 + 上传授权文件 -->
  <div class="form" id="vUpload">
    <div class="row"><label>激活文件：</label>
      <div class="ctrl"><button class="btn sm" id="btnDown">下 载</button><button class="dot inline" data-note="down" title="查看 PRD 标注">1</button>
        <div class="hint">提示：下载云盒的唯一标识，给到商务或官方客服，获取授权文件</div></div></div>
    <div class="row"><label>授权文件：</label>
      <div class="ctrl"><div style="display:flex;align-items:center;">
        <div class="drop" id="drop"><div class="folder">+</div><div id="dropTxt">选择文件</div></div>
        <button class="dot inline" data-note="lic" title="查看 PRD 标注">2</button></div>
        <div class="err-msg" id="licErr"></div></div></div>
    <div class="footer"><button class="btn ghost" id="btnPrev1">上一步</button><button class="btn" id="btnNext1" disabled>下一步</button></div>
  </div>

  <!-- 状态二：验证通过，展示设备激活信息 -->
  <div class="info" id="vInfo" style="display:none">
    <div class="bar">// 设备激活信息<button class="dot" data-note="info" title="查看 PRD 标注">3</button></div>
    <ul>
      <li>云盒授权开始时间：<span id="iStart"></span></li>
      <li>云盒授权结束时间：<span id="iEnd"></span></li>
      <li>云盒授权设备数量：<span id="iNum"></span></li>
      <li>licenseKey：<span id="iKey"></span></li>
    </ul>
    <div class="footer"><button class="btn ghost" id="btnPrev2">上一步</button><button class="btn" id="btnNext2">下一步</button></div>
  </div>
</div>

<div class="pop" id="pop"><div class="hd"><span id="popTitle"></span><span class="close" id="popClose">✕</span></div><div class="bd" id="popBody"></div></div>

<!-- 返回确认弹窗（同第一步） -->
<div class="mask" id="mBack"><div class="modal">
  <div class="mhd"><span>提示</span><span class="close" data-close="mBack">✕</span></div>
  <div class="mbd">您当前的修改内容未重启、未激活，若返回则不会保存，是否继续返回？</div>
  <div class="mft"><button class="btn ghost" data-close="mBack">继续填写</button><button class="btn" id="btnBackOk">继续返回</button></div>
</div></div>

<div class="ctrl-panel">PRD 标注 <div class="switch" id="sw" title="显示 / 隐藏标注点"></div>
  <span id="stWrap">页面状态 <span class="seg" id="segSt"><button data-v="up" class="on">上传授权文件</button><button data-v="info">已激活（直接展示激活信息）</button></span></span>
  <span id="chkWrap">授权文件验证 <span class="seg" id="segChk"><button data-v="1" class="on">通过</button><button data-v="0">不通过</button></span></span>
  <a id="reset" title="清除本页演示数据">重置演示</a></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePicker" style="display:none">

<script>
// ---------- 场景：激活流程（act） / 配置模块（cfg），由首页入口写入 ----------
var INIT_CFG = (function () { try { var q = new URLSearchParams(location.search).get('mode'); if (q) sessionStorage.setItem('initMode', q); return sessionStorage.getItem('initMode') === 'cfg'; } catch (e) { return false; } })();
var HOME_URL = INIT_CFG ? 'home.html?act=1' : 'home.html';
if (INIT_CFG) {
  document.querySelectorAll('.step').forEach(function (s) { var n = s.querySelector('.num'); if (n && n.textContent.trim() === '6') s.lastChild.textContent = '重启服务'; });
  document.title = document.title.replace('· 初始化 ·', '· 配置 ·').replace('系统初始化', '重启服务');
  var _h1 = document.querySelector('.titlebar h1'); if (_h1) _h1.textContent = '配置';
}

// ===== PRD 标注内容 =====
var NOTES = {
  down: { title: '激活文件', items: [
    { cls: 'change', tag: '变更', ver: 'B1.3.0', html: '激活方式字段隐藏，默认选择<b>文件激活</b>。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '点击【下载】，下载激活文件。文件内容为<b>设备 ID</b>（云盒唯一标识）及相关设备信息：设备型号、序列号、MAC 地址、硬件指纹、系统版本、软件版本、生成时间。' },
    { cls: 'draft', tag: '待确认', ver: 'B1.3.0', html: '激活文件里除设备 ID 外具体包含哪些设备信息、文件格式（当前演示为 JSON，后缀 .req），以研发和第三方授权系统的约定为准。' },
    { cls: 'change', tag: '变更', ver: 'B1.3.0', html: '下载旁新增提示：「下载云盒的唯一标识，给到商务或官方客服，获取授权文件」。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '业务流程：用户下载激活文件 → 交给客服 → 客服在第三方授权系统生成并下载对应的授权文件 → 返回给用户上传。' }
  ]},
  lic: { title: '授权文件', items: [
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '点击虚线框选择文件（也可拖入），选择后<b>自动上传并验证</b>，无需再点按钮。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '验证<b>通过</b>：切换为「设备激活信息」展示，【下一步】可点。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '验证<b>不通过</b>：提示「该文件不正确」，停留在上传状态，可重新选择文件。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '未通过验证前，【下一步】置灰不可点。' },
    { cls: 'change', tag: '变更', ver: 'B1.3.0', html: '删除检验信息；删除原【激活并验证】按钮，改为上传后自动验证。' }
  ]},
  info: { title: '设备激活信息', items: [
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '<b>激活流程</b>：若之前已上传过授权文件并验证通过，进入本步时直接展示设备激活信息，可点「下一步」进入第三步；未上传过则展示下载激活文件 / 上传授权文件页面。<br><b>配置模块</b>：设备已激活，<b>不展示上传页面</b>，始终展示验证通过后的设备激活信息。' },
    { cls: 'change', tag: '变更', ver: 'B1.3.0', html: '许可ID：后台保存，页面隐藏。' },
    { cls: 'change', tag: '变更', ver: 'B1.3.0', html: '授权开始时间、结束时间，新增【云盒】字样。' },
    { cls: 'change', tag: '变更', ver: 'B1.3.0', html: '新增「云盒授权设备数量」：取值对应 licenseKey 的设备授权数量。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: 'licenseKey 只显示首尾 4 位，中间用 **** 打码，例如 SL5X-****-****-8636。' }
  ]}
};

// ===== 标注点弹层（同第一步） =====
var pop = document.getElementById('pop'), curDot = null;
function openNote(dot) {
  if (curDot === dot) return closeNote();
  closeNote();
  var n = NOTES[dot.dataset.note];
  document.getElementById('popTitle').textContent = n.title;
  document.getElementById('popBody').innerHTML = n.items.map(function (it) {
    return '<div class="note ' + it.cls + '"><span class="tag">' + it.tag + '</span><span class="ver">' + it.ver + '</span>' + it.html + '</div>';
  }).join('');
  pop.classList.add('show');
  var r = dot.getBoundingClientRect();
  var left = r.right + 10 + window.scrollX, top = r.top - 10 + window.scrollY;
  if (r.right + 400 > document.documentElement.clientWidth) left = r.left - 390 + window.scrollX;
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  dot.classList.add('open'); curDot = dot;
}
function closeNote() { pop.classList.remove('show'); if (curDot) curDot.classList.remove('open'); curDot = null; }
document.addEventListener('click', function (e) {
  var d = e.target.closest('.dot');
  if (d) { e.stopPropagation(); openNote(d); return; }
  if (!pop.contains(e.target)) closeNote();
});
document.getElementById('popClose').onclick = closeNote;
document.getElementById('sw').onclick = function () { this.classList.toggle('off'); document.body.classList.toggle('hide-dots'); closeNote(); };
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 2200); }

// ===== 演示数据 =====
var STORE = 'yw_step2';
var LIC = { start: '2025-05-19', end: '永久授权', num: 4, key: 'SL5X-****-****-8636' };
var chkOk = true;
document.querySelectorAll('#segChk button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('#segChk button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on'); chkOk = b.dataset.v === '1';
  };
});

// ===== 两个状态切换 =====
function showInfo(d) {
  document.getElementById('iStart').textContent = d.start;
  document.getElementById('iEnd').textContent = d.end;
  document.getElementById('iNum').textContent = d.num;
  document.getElementById('iKey').textContent = d.key;
  document.getElementById('vUpload').style.display = 'none';
  document.getElementById('vInfo').style.display = '';
}
function showUpload() {
  document.getElementById('vInfo').style.display = 'none';
  document.getElementById('vUpload').style.display = '';
}
function markSt(v) {
  document.querySelectorAll('#segSt button').forEach(function (x) { x.classList.toggle('on', x.dataset.v === v); });
  document.getElementById('chkWrap').style.display = v === 'up' ? '' : 'none';
}
var saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
if (INIT_CFG) {
  // 配置模块：设备已激活，不存在上传页，始终展示激活信息
  showInfo(saved || LIC);
  document.getElementById('stWrap').style.display = 'none';
  document.getElementById('chkWrap').style.display = 'none';
} else if (saved) { showInfo(saved); markSt('info'); }
document.querySelectorAll('#segSt button').forEach(function (b) {
  b.onclick = function () {
    var v = b.dataset.v; markSt(v);
    if (v === 'info') { localStorage.setItem(STORE, JSON.stringify(LIC)); showInfo(LIC); toast('已切换：之前已上传过授权文件，直接展示激活信息'); }
    else { localStorage.removeItem(STORE); showUpload(); toast('已切换：未上传授权文件，需下载激活文件并上传授权文件'); }
  };
});
document.getElementById('reset').onclick = function () { localStorage.removeItem(STORE); location.reload(); };

// ===== 下载激活文件（演示：内容为设备 ID 及相关设备信息） =====
// 演示数据：设备 ID 首次生成后固定，同一台设备每次下载内容一致
function devId() {
  var id = localStorage.getItem('yw_device_id');
  if (!id) { id = 'CLOUDBOX-' + Math.random().toString(36).slice(2, 10).toUpperCase(); localStorage.setItem('yw_device_id', id); }
  return id;
}
document.getElementById('btnDown').onclick = function () {
  var info = {
    deviceId: devId(),            // 设备 ID（云盒唯一标识）
    model: 'YW-BOX-3000',         // 设备型号
    serialNo: 'SN20250519008636', // 设备序列号
    mac: '00:1A:2B:3C:4D:5E',     // 网卡 MAC 地址
    hardwareId: 'HW-7F3A-9C21-E4B8', // 硬件指纹（主板/CPU/硬盘）
    osVersion: 'Ubuntu 20.04 LTS', // 系统版本
    appVersion: 'B1.3.0',         // 软件版本
    createdAt: new Date().toISOString().slice(0, 19).replace('T', ' ') // 生成时间
  };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(info, null, 2)], { type: 'application/json' }));
  a.download = 'activation_' + info.deviceId + '.req'; a.click();
  toast('激活文件已下载，请发给商务或官方客服获取授权文件');
};

// ===== 上传授权文件 → 自动验证 =====
var drop = document.getElementById('drop'), picker = document.getElementById('filePicker');
var dropTxt = document.getElementById('dropTxt'), licErr = document.getElementById('licErr'), busy = false;
function verify(file) {
  if (!file || busy) return;
  busy = true; licErr.textContent = ''; drop.classList.remove('bad'); drop.classList.add('busy');
  dropTxt.textContent = '正在验证 ' + file.name + ' …';
  setTimeout(function () {
    busy = false; drop.classList.remove('busy'); dropTxt.textContent = '选择文件';
    if (!chkOk) { drop.classList.add('bad'); licErr.textContent = '该文件不正确，请重新选择授权文件'; return toast('该文件不正确'); }
    localStorage.setItem(STORE, JSON.stringify(LIC));
    toast('授权文件验证通过'); showInfo(LIC); markSt('info');
  }, 1200);
}
drop.onclick = function () { if (busy) return; picker.value = ''; picker.click(); };
picker.onchange = function () { verify(picker.files[0]); };
drop.addEventListener('dragover', function (e) { e.preventDefault(); });
drop.addEventListener('drop', function (e) { e.preventDefault(); verify(e.dataTransfer.files[0]); });

// ===== 返回 / 上一步 / 下一步 =====
function openM(id) { document.getElementById(id).classList.add('open'); }
function closeM(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(function (el) { el.addEventListener('click', function () { closeM(el.dataset.close); }); });
document.getElementById('btnBack').onclick = function () { openM('mBack'); };
document.getElementById('btnBackOk').onclick = function () { closeM('mBack'); location.href = HOME_URL; };
document.getElementById('btnPrev1').onclick = document.getElementById('btnPrev2').onclick = function () { location.href = 'activate-step1-network.html'; };
// 验证通过后进入第三步「基础服务配置」
document.getElementById('btnNext2').onclick = function () { location.href = 'activate-step3-service.html'; };
</script>
