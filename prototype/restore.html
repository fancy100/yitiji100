  .infobar { background: #e8f4ff; border: 1px solid #91caff; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 14px; }

  .okt { color: #52c41a; font-size: 13px; } .badt { color: #e4393c; font-size: 13px; }
  .meta { background: #f5f7fa; padding: 10px 14px; font-size: 13px; line-height: 2; margin: 10px 0 20px; }

  .gap { height: 22px; }
  .nav { text-align: center; margin-top: 34px; } .nav .btn { margin: 0 6px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .notice1 { width: 680px; margin: 56px auto 24px; background: #f2f2f2; padding: 26px 20px; text-align: center; font-size: 16px; line-height: 1.6; color: #333; }
  .bigb { width: 140px; height: 40px; font-size: 14px; }
  .hint { color: #fa8c16; font-size: 13px; margin-top: 10px; } .hint a { color: #1a6cfb; }
  .box { width: 540px; margin: 24px auto 0; border: 1px solid #999; }
  .boxT { font-size: 16px; font-weight: bold; padding: 14px 28px; border-bottom: 1px solid #999; }

  .rl { font-size: 16px; margin-bottom: 14px; }
  #rList label { display: block; line-height: 25px; padding-left: 20px; font-size: 13px; cursor: pointer; }

  .pbar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 18px 0 6px; } .pbar i { display: block; height: 100%; width: 0; background: #1a6cfb; transition: width .3s; }

<body>
<div class="topbar"><div class="logo">运维中心</div><div class="right"><div class="entry" id="goHome"><span class="ico">⌂</span>功能入口</div><div class="user"><span class="ico">A</span>admin ⌄</div></div></div>
<div class="titlebar"><span class="back" id="btnBack" title="返回">←</span><h1 id="crumb">还原 &gt;&gt; 一键还原</h1></div>
<div class="card"><div class="wrap">
  <div class="tabs2"><button class="tb2" data-tab="one">一键还原</button><button class="tb2" data-tab="imp">导入还原</button><button class="dot" data-note="tab">1</button></div>
  <div id="p-one">
    <div class="notice1" style="margin-top:30px">复原会占用服务，系统数据会按照您选择的备份数据进行还原，建议您在此期间不再使用翼飞平台。复原时间会根据备份数据大小不同而不同，请您耐心等待</div>
    <div class="lhead" style="margin-top:6px"><h3>复原数据<button class="dot" data-note="pick">3</button></h3><span class="cnt">仅显示最新 5 份备份数据</span></div>
    <div id="secPick"><table class="tb"><thead><tr><th style="width:64px">选择</th><th style="width:64px">序号</th><th>备份名称</th><th style="width:100px">版本号</th><th style="width:140px">备份内容</th><th style="width:100px">备份方式</th><th style="width:100px">数据大小</th><th style="width:150px">备份时间</th></tr></thead><tbody id="rList"></tbody></table></div>
    <div class="center" style="margin-top:30px"><button class="btn bigb" id="btnOpen">开始复原</button><button class="dot" data-note="one">2</button><button class="dot" data-note="go">4</button></div>
    <div class="center hint" id="autoHint" style="display:none">当前有备份任务正在进行中，「开始复原」暂不可用，请等待备份完成后再操作。</div>
  </div>

  <div id="p-imp" style="display:none">
    <div class="infobar">● 当前版本：<span id="curVer"></span>；剩余空间：<span id="space"></span><span class="rf" id="btnRf" title="刷新">↻</span><button class="dot" data-note="info">5</button></div>
    <div class="steps" id="steps"></div>
    <div id="impBody"></div>
  </div>
</div></div>
<input type="file" id="fileIn" accept=".zip" style="display:none">
<div class="pop" id="pop"><div class="hd"><span id="popT"></span><span class="close" id="popX">✕</span></div><div class="bd" id="popB"></div></div>
<div class="mask" id="mask"><div class="modal">
  <div class="mhd"><span id="mT"></span><span class="close" id="mX">✕</span></div>
  <div class="mbd" id="mB"></div>
  <div class="mft" id="mF"></div>
</div></div>
<div class="ctrl-panel">
  <span>PRD 标注</span><div class="switch" id="swDots"></div>
  <span class="c-imp">上传结果 <select id="selUp"><option value="ok">成功</option><option value="bad">文件损坏</option><option value="ver">版本不一致</option><option value="type">备份类型不符</option></select></span>
  <span class="c-imp">执行结果 <select id="selRun"><option value="ok">成功</option><option value="fail">失败</option></select></span>
  <span class="c-one">可复原数据 <select id="selData"><option value="has">有可复原的数据</option><option value="none">没有可复原的数据</option></select></span>
  <span class="c-one">备份状态 <select id="selAuto"><option value="0">无备份任务</option><option value="1">备份进行中</option></select></span>
  <span class="c-one">复原结果 <select id="selOne"><option value="ok">成功</option><option value="proj">项目数据不存在</option><option value="space">空间不足</option><option value="up">上传失败</option><option value="bad">文件损坏</option><option value="ver">版本不兼容</option><option value="mod">模块不一致</option><option value="exec">执行失败</option></select></span>
  <a id="reset">重置演示</a>
</div>
<div class="toast" id="toast"></div>
<script>
function $(id) { return document.getElementById(id); }
var BK = 'yw_backup', KEY = 'yw_restore', VER = 'P1.5.0', PRJ = 'xhz';
var PARTS = ['基础数据', '飞行数据', '成果数据'];
var SIZE = { '基础数据': 1.2, '飞行数据': 36.5, '成果数据': 58.3 };
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtD(t) { var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function stamp(t) { var d = new Date(t); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()); }
function isFull(c) { return PARTS.every(function (p) { return c.indexOf(p) >= 0; }); }
function cName(c) { return isFull(c) ? '全量数据' : c.join('+'); }
function sizeOf(c) { return Math.round(c.reduce(function (a, p) { return a + SIZE[p]; }, 0) * 10) / 10; }

/* ---------- 备份数据（读取备份页面的数据；没有时用演示数据） ---------- */

olyline points="552,658 552,680" fill="none" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#ab)"/><polygon points="400,736 464,760 400,784 336,760" fill="#7ff" stroke="#999"/><text x="400" y="757.75" font-size="10.5" text-anchor="middle" fill="#333">版本对应的模块</text><text x="400" y="770.25" font-size="10.5" text-anchor="middle" fill="#333">是否一致</text><polyline points="400,664 400,734" fill="none" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#ab)"/><rect x="382" y="691" width="36" height="15" fill="#fff"/><text x="400" y="703" font-size="11" text-anchor="middle" fill="#333">一致</text><rect x="500" y="742" width="104" height="36" fill="#fff" stroke="#999"/><text x="552" y="757.5" font-size="11" text-anchor="middle" fill="#333">提示：导入数据</text><text x="552" y="770.5" font-size="11" text-anchor="middle" fill="#333">对应模块不一致</text><polyline points="464,760 498,760" fill="none" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#ab)"/><rect x="464" y="737" width="36" height="15" fill="#fff"/><text x="482" y="749" font-size="11" text-anchor="middle" fill="#333">不一致</text><rect x="348" y="817" width="104" height="36" fill="#c5f08a" stroke="#999"/><text x="400" y="839" font-size="11" text-anchor="middle" fill="#333">提示导入成功</text><polyline points="400,784 400,815" fill="none" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#ab)"/><rect x="402" y="791" width="36" height="15" fill="#fff"/><text x="420" y="803" font-size="11" text-anchor="middle" fill="#333">一致</text></svg><div style="font-size:12px;color:#666;margin-top:6px">绿色：成功节点；青色菱形：文件校验；任何一步失败，系统数据都不改动。</div>'],
  s1: ['第 1 步：基础数据', '<ol><li>必填，否则系统无法正常展示数据。</li><li>点「上传备份基础数据」，只支持 .zip。上传后显示文件名、上传成功，以及导入版本、项目信息、备份时间、上传时间。导入前点 ✕ 可以移除重新上传，导入后不能移除。</li><li>上传失败时弹窗「数据上传失败」；版本和当前系统不一致时不能导入。</li><li>上传后「导入系统并执行」才可点，执行中弹窗显示进度：导入复原中，复原会占用服务，建议您在此期间不再使用翼飞平台。失败时弹窗「数据导入执行失败」。</li><li>导入成功后「下一步」才可点。</li></ol>'],
  s2: ['第 2 步：飞行数据', '可选，上传和导入规则同第 1 步。可以不上传，直接点「下一步」跳过。已上传但没导入就点「下一步」，会先确认是否跳过。不导入的话，飞行业务没有历史数据。'],
  s3: ['第 3 步：成果数据', '可选，规则同第 2 步。不导入的话，成果业务没有历史数据。'],
  s4: ['第 4 步：执行成功', '显示已导入和未导入的数据。点「进入系统」回到首页，点「重新导入」从第 1 步重新开始。']
};
var dotsOn = localStorage.getItem('yw_dots') !== '0';
function syncDots() { $('swDots').classList.toggle('off', !dotsOn); document.querySelectorAll('.dot').forEach(function (d) { d.style.display = dotsOn ? '' : 'none'; }); if (!dotsOn) $('pop').style.display = 'none'; }
function openNote(btn) {
  var n = NOTES[btn.getAttribute('data-note')] || ['说明', '（待补充）'], p = $('pop'), rc = btn.getBoundingClientRect();
  $('popT').textContent = n[0]; $('popB').innerHTML = n[1]; p.classList.toggle('wide', btn.getAttribute('data-note') === 'go'); p.style.display = 'block';
  var left = Math.min(window.innerWidth - p.offsetWidth - 10, rc.right + 8);
  p.style.position = 'fixed'; p.style.left = Math.max(10, left) + 'px'; p.style.top = Math.min(window.innerHeight - p.offsetHeight - 10, rc.top) + 'px';
}

/* ---------- 事件 ---------- */
document.addEventListener('click', function (e) {
  var t = e.target, a;
  if (t.classList.contains('dot')) { e.stopPropagation(); openNote(t); return; }
  if (!t.closest('#pop')) $('pop').style.display = 'none';
  if ((a = t.getAttribute('data-tab'))) { setTab(a); return; }
  var eu = t.closest('[data-up]'), er = t.closest('[data-rm]'), ea = t.closest('[data-act]');
  if (eu && (a = eu.getAttribute('data-up'))) { if (restoring || eu.disabled || fileOf(a)) return; upFor = a; $('fileIn').click(); return; }
  if (er && (a = er.getAttribute('data-rm'))) { if (restoring || isDone(a)) return; delete st.imp.files[a]; save(); renderImp(); return; }
  if (ea && (a = ea.getAttribute('data-act'))) { if (ea.disabled) return; act(a); return; }
});
$('popX').onclick = function () { $('pop').style.display = 'none'; };
$('swDots').onclick = function () { dotsOn = !dotsOn; localStorage.setItem('yw_dots', dotsOn ? '1' : '0'); syncDots(); };
$('btnOpen').onclick = function () { if (!this.disabled) goRestore(); };
$('rList').onclick = function (e) { var tr = e.target.closest('tr[data-rid]'); if (!tr) return; tr.querySelector('input').checked = true; this.querySelectorAll('tr').forEach(function (x) { x.classList.toggle('sel', x === tr); }); syncGo(); };
$('btnRf').onclick = function () { renderInfo(); renderOne(); renderPick(); toast('已刷新'); };
$('goHome').onclick = $('btnBack').onclick = function () { if (restoring || oneRun()) { toast('还原进行中，请勿离开页面', 1); return; } location.href = 'home.html'; };
$('reset').onclick = function () {
  if (restoring || oneRun()) { toast('还原进行中，请稍后重置', 1); return; }
  localStorage.removeItem(KEY); st = initState(); st.imp.files = {}; save();
  renderInfo(); setTab(tab); toast('已重置演示数据');
};

/* ---------- 初始化 ---------- */
window.addEventListener('beforeunload', function (e) { if (restoring) { e.preventDefault(); e.returnValue = ''; } });
renderInfo();
setTab(!oneRun() && /tab=imp/.test(location.search) ? 'imp' : 'one', true);
$('selData').value = localStorage.getItem('yw_rs_data') === 'none' ? 'none' : 'has';
$('selAuto').onchange = function () { autoLocal = this.value === '1'; syncGo(); toast(autoLocal ? '演示：备份任务进行中' : '演示：无备份任务'); };
setInterval(syncGo, 2000);
$('selData').onchange = function () { localStorage.setItem('yw_rs_data', this.value); renderPick(); toast(this.value === 'none' ? '已切换为：没有可复原的数据' : '已切换为：有可复原的数据'); };
setInterval(tickOne, 300);
if (oneRun() && Date.now() < oneRun().end) showProg(); else tickOne();
syncDots();
</script>
