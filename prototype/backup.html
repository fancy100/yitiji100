<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维中心 · 备份</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; color: #333; background: #eef0f3; }
  .topbar { height: 50px; background: #1a6cfb; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .topbar .logo { font-size: 18px; }
  .topbar .right { display: flex; align-items: center; gap: 28px; }
  .topbar .entry, .topbar .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .topbar .ico { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #1a6cfb; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
  .titlebar { height: 42px; background: #fff; display: flex; align-items: center; padding: 0 22px; border-bottom: 1px solid #eee; }
  .titlebar .back { font-size: 18px; margin-right: 14px; cursor: pointer; }
  .titlebar h1 { font-size: 15px; font-weight: bold; }
  .card { max-width: 1320px; min-height: 620px; margin: 20px auto 30px; background: #fff; padding: 30px 0 40px; }
  .wrap { width: 980px; margin: 0 auto; }
  .tabs { border-bottom: 1px solid #e6e6e6; margin-bottom: 26px; }
  .tabs span { display: inline-block; padding: 10px 40px; background: #1a6cfb; color: #fff; border-radius: 4px 4px 0 0; }
  .btn { height: 32px; padding: 0 18px; border-radius: 4px; border: 1px solid #1a6cfb; background: #1a6cfb; color: #fff; font-size: 13px; cursor: pointer; }
  .btn.ghost { background: #fff; color: #333; border-color: #d9d9d9; }
  .btn.ghost:hover { color: #1a6cfb; border-color: #1a6cfb; }
  .bar1 { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; position: relative; }
  .bar1 .lbl { font-size: 15px; }
  .bar1 label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; position: relative; }
  .bar1 .ops { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .q { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #999; color: #999; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; cursor: help; position: relative; }
  .q .tipx { display: none; position: absolute; left: -10px; top: 24px; width: 320px; background: #fffbe6; border: 1px solid #ffe58f; color: #614700; padding: 10px 12px; border-radius: 6px; font-size: 12px; line-height: 1.8; text-align: left; z-index: 30; box-shadow: 0 4px 12px rgba(0,0,0,.12); cursor: default; }
  .q:hover .tipx { display: block; }
  .prog { border: 1px dashed #6aa6ff; border-radius: 4px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; background: #f7faff; margin-bottom: 14px; }
  .prog.ok { border-color: #95de64; background: #f6ffed; }
  .prog.bad { border-color: #ffa39e; background: #fff1f0; }
  .prog .ic { width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; color: #1a6cfb; font-size: 20px; }
  .prog.ok .ic { color: #52c41a; } .prog.bad .ic { color: #e4393c; }
  .prog .main { flex: 1; }
  .prog .txt { font-size: 13px; margin-bottom: 8px; }
  .prog .txt b { color: #1a6cfb; font-weight: normal; }
  .prog .row2 { display: flex; align-items: center; gap: 8px; }
  .prog .track { flex: 1; height: 6px; background: #e8e8e8; border-radius: 3px; overflow: hidden; }
  .prog .fill { height: 100%; width: 0; background: #1a6cfb; transition: width .4s; }
  .prog.ok .fill { background: #52c41a; } .prog.bad .fill { background: #e4393c; }
  .prog .pct { font-size: 12px; color: #666; width: 40px; text-align: right; }
  .lhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .lhead h3 { font-size: 15px; flex: 1; }
  .lhead .cnt { font-size: 13px; color: #1a6cfb; background: #e8f1ff; padding: 5px 14px; border-radius: 3px; }
  table.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tb th { background: #e8f1ff; height: 44px; font-weight: bold; border: 1px solid #e3e8f0; }
  table.tb td { height: 44px; text-align: center; border: 1px solid #eef0f3; }
  .lnk { color: #1a6cfb; cursor: pointer; margin: 0 6px; }
  .lnk:hover { text-decoration: underline; }
  .dis { color: #bbb; margin: 0 6px; cursor: not-allowed; }
  .s-cur { color: #e4393c; } .s-run { color: #fa8c16; } .s-done { color: #389e0d; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #666; }
  .pager span.on { background: #1a6cfb; color: #fff; padding: 2px 9px; border-radius: 3px; }
  .filters { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-size: 13px; }
  .filters input, .filters select { height: 30px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; font-size: 13px; }
  .empty { text-align: center; color: #999; padding: 30px 0; }
  /* 标注 / 弹窗 / 提示 */
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #ff7a00; color: #fff; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; vertical-align: middle; margin-left: 6px; flex-shrink: 0; }
  .dot.open { background: #1a6cfb; }
  body.hide-dots .dot { display: none !important; }
  .pop { position: absolute; width: 640px; max-width: calc(100vw - 24px); background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 80; font-size: 13px; line-height: 1.7; display: none; }
  .pop.show { display: block; }
  .pop .hd { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
  .pop .hd .close { cursor: pointer; color: #999; font-weight: normal; }
  .pop .bd { padding: 10px 14px 12px; max-height: 460px; overflow: auto; }
  .note { padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; background: #fff6c2; border-left: 3px solid #ffdf25; }
  .note .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; margin-right: 6px; background: rgba(255,255,255,.75); }
  .note .ver { float: right; font-size: 11px; color: #888; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .mask.open { display: flex; }
  .modal { width: 420px; background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .modal .mhd { padding: 14px 20px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }
  .modal .mhd .close { cursor: pointer; color: #999; font-weight: normal; }
  .modal .mbd { padding: 24px 22px; font-size: 14px; line-height: 1.8; }
  .modal .mft { padding: 10px 20px 16px; display: flex; justify-content: flex-end; gap: 10px; }
  .imp { text-align: center; padding: 30px 0 10px; }
  .imp .cl { font-size: 54px; color: #1a6cfb; }
  .ctrl-panel { position: fixed; left: 20px; bottom: 20px; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 14px; font-size: 12px; z-index: 60; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 560px; }
  .ctrl-panel select { height: 24px; font-size: 12px; }
  .ctrl-panel a { color: #1a6cfb; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; background: #1a6cfb; border-radius: 10px; cursor: pointer; }
  .switch::after { content: ""; position: absolute; left: 18px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch.off { background: #ccc; } .switch.off::after { left: 2px; }
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 9px 20px; border-radius: 4px; z-index: 300; display: none; font-size: 13px; }
  .toast.bad { background: #e4393c; }
  .spin .prog { border: none; background: none; padding: 0; }
  /* 备份页专用 */
  .tabs2 { display: flex; align-items: center; margin-bottom: 14px; }
  .tabs2 button.tb2 { width: 138px; height: 38px; border: 1px solid #d9d9d9; background: #fff; font-size: 14px; cursor: pointer; }
  .tabs2 button.tb2:first-child { border-radius: 4px 0 0 4px; } .tabs2 button.tb2:nth-child(2) { border-radius: 0 4px 4px 0; border-left: none; }
  .tabs2 button.tb2.on { background: #1a6cfb; border-color: #1a6cfb; color: #fff; }
  .info { background: #eef6ff; border: 1px solid #bcd8ff; border-radius: 4px; padding: 8px 14px; font-size: 13px; color: #555; margin-bottom: 22px; display: flex; align-items: center; gap: 8px; }
  .info .i { width: 16px; height: 16px; border-radius: 50%; background: #1a6cfb; color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
  .info .rf { cursor: pointer; color: #1a6cfb; font-size: 15px; }
  .frm .fr { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .frm .fl { width: 130px; font-size: 15px; font-weight: bold; }
  .frm input[type=number], .frm input[type=time] { height: 32px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; width: 100px; font-size: 14px; }
  .frm label { display: inline-flex; align-items: center; gap: 6px; margin-right: 22px; cursor: pointer; position: relative; }
  .frm .next { font-size: 12px; color: #888; margin-left: 8px; }
  #autoBody.off { opacity: .45; pointer-events: none; }
  .cloud { margin: -4px 0 18px 140px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; padding: 16px 20px 6px; width: 580px; }
  .cloud .cr { display: flex; align-items: center; margin-bottom: 12px; }
  .cloud .cr span { width: 150px; text-align: right; padding-right: 10px; font-size: 13px; }
  .cloud .cr i { color: #e4393c; font-style: normal; margin-right: 3px; }
  .cloud .cr input { flex: 1; height: 30px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; }
  .cloud .cr input.err { border-color: #e4393c; }
  .mbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
  .sec { margin-top: 34px; }
  .sh { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .sh h3 { font-size: 16px; } .sh .sub { font-size: 13px; color: #888; flex: 1; }
  .st { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; }
  .st.no { background: #e8f1ff; color: #1a6cfb; } .st.run { background: #fff7e6; color: #fa8c16; } .st.ok { background: #f6ffed; color: #389e0d; }
  .ferr { display: block; font-size: 12px; color: #e4393c; margin-top: 2px; }
  .menu { position: absolute; background: #fff; border: 1px solid #e3e8f0; box-shadow: 0 4px 12px rgba(0,0,0,.12); border-radius: 4px; z-index: 90; display: none; padding: 4px 0; }
  .menu.show { display: block; }
  .menu div { padding: 7px 18px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .menu div:hover { background: #e8f1ff; }
  .menu div.off { color: #bbb; cursor: not-allowed; background: none; }
  .fail { color: #e4393c; }
  .spin { text-align: center; padding: 6px 0 4px; font-size: 16px; }
  .spin .cl { font-size: 46px; color: #1a6cfb; display: inline-block; animation: rot 1.2s linear infinite; margin-bottom: 8px; }
  .spin .cl.okc { color: #52c41a; animation: none; }
  @keyframes rot { to { transform: rotate(360deg); } }
  table.tb td.nm { text-align: left; padding: 0 10px; }
</style>
</head>
<body>
<div class="topbar"><div class="logo">运维中心</div><div class="right"><div class="entry" id="goHome"><span class="ico">⌂</span>功能入口</div><div class="user"><span class="ico">A</span>admin ⌄</div></div></div>
<div class="titlebar"><span class="back" id="btnBack" title="返回">←</span><h1 id="crumb">备份</h1></div>
<div class="card"><div class="wrap">
  <div id="v-main">
    <div class="tabs2"><button class="tb2" data-tab="auto">自动备份</button><button class="tb2" data-tab="manual">手动备份</button><button class="dot" data-note="tab">1</button></div>
    <div class="info"><span class="i">i</span>当前版本：P1.5.0；剩余空间：<span id="space"></span><span class="rf" id="btnRf" title="刷新">↻</span></div>

    <div id="p-auto" class="frm">
      <div class="fr"><span class="fl">自动备份</span><div class="switch" id="swAuto"></div><button class="dot" data-note="auto">2</button></div>
      <div id="autoBody">
        <div class="fr"><span class="fl">自动备份时间</span>每 <input type="number" id="fDays" min="1" max="30"> 日 <input type="time" id="fTime"><span class="next" id="nextT"></span><button class="dot" data-note="time">3</button></div>
        <div class="fr"><span class="fl">备份内容</span>
          <label><input type="checkbox" data-c="基础数据" checked disabled>基础数据</label>
          <label><input type="checkbox" data-c="飞行数据">飞行数据</label>
          <label><input type="checkbox" data-c="成果数据">成果数据</label><button class="dot" data-note="content">4</button></div>
        <div class="fr"><span class="fl">备份文件方式</span>
          <label><input type="radio" name="mode" value="local">本地备份<span class="q">?<span class="tipx">备份文件只保存在云盒本地磁盘，占用本地剩余空间。</span></span></label>
          <label><input type="radio" name="mode" value="both">本地备份+云端备份<span class="q">?<span class="tipx">本地保存一份，同时上传一份到云端对象存储。需要填写下方的云端存储参数。</span></span></label>
          <button class="dot" data-note="mode">5</button></div>
        <div class="cloud" id="cloud">
          <div class="cr"><span><i>*</i>文件过期时间：</span><input id="c_exp" placeholder="单位：秒"></div>
          <div class="cr"><span><i>*</i>存储桶名称：</span><input id="c_bucket" placeholder="请输入存储桶名称"></div>
          <div class="cr"><span><i>*</i>EndPoint地址：</span><input id="c_ep" placeholder="请输入 EndPoint 地址"></div>
          <div class="cr"><span>CDN地址：</span><input id="c_cdn" placeholder="选填"></div>
          <div class="cr"><span><i>*</i>AccessKeySecret：</span><input id="c_sk" type="password" placeholder="请输入 AccessKeySecret"></div>
          <div class="cr"><span><i>*</i>AccessKeyId：</span><input id="c_ak" placeholder="请输入 AccessKeyId"></div>
        </div>
      </div>
      <div class="fr"><button class="btn" id="btnSave" style="width:130px">保存</button></div>
    </div>

    <div id="p-manual" style="display:none">
      <div class="mbar"><button class="btn" id="btnFull">全量备份</button><button class="dot" data-note="manual">6</button></div>
      <table class="tb"><thead><tr><th style="width:70px">序号</th><th>导出数据</th><th>大小</th><th>状态</th><th>备份时间</th><th style="width:120px">操作</th></tr></thead><tbody id="tbMan"></tbody></table>
    </div>

    <div class="sec">
      <div class="sh"><h3>备份数据<button class="dot" data-note="data">7</button></h3><span class="sub">仅保留最近 5 份全量备份数据 + 自动备份数据</span><button class="btn" id="btnRec">备份记录</button></div>
      <table class="tb"><thead><tr><th style="width:60px">序号</th><th>备份数据</th><th style="width:140px">备份方式</th><th>备份内容</th><th style="width:90px">备份大小</th><th style="width:140px">备份时间</th><th style="width:190px">操作<button class="dot" data-note="ops">8</button></th></tr></thead><tbody id="tbData"></tbody></table>
    </div>
  </div>

  <div id="v-rec" style="display:none">
    <div class="sh"><h3>备份记录<button class="dot" data-note="rec">9</button></h3></div>
    <table class="tb"><thead><tr><th style="width:50px">序号</th><th>备份数据</th><th>备份方式</th><th>备份类型</th><th>数据存储</th><th>备份大小</th><th style="width:130px">备份时间</th><th>备份耗时</th><th>备份成功</th><th>数据状态</th></tr></thead><tbody id="tbRec"></tbody></table>
  </div>
</div></div>

<div class="pop" id="pop"><div class="hd"><span id="popT"></span><span class="close" id="popX">✕</span></div><div class="bd" id="popB"></div></div>
<div class="menu" id="menu"></div>
<div class="mask" id="mask"><div class="modal">
  <div class="mhd"><span id="mT"></span><span class="close" id="mX">✕</span></div>
  <div class="mbd" id="mB"></div>
  <div class="mft" id="mF"></div>
</div></div>
<div class="ctrl-panel">
  <span>PRD 标注</span><div class="switch" id="swDots"></div>
  <span>备份结果 <select id="selRes"><option value="ok">成功</option><option value="space">剩余空间不足</option><option value="net">网络异常</option><option value="stop">任务中断</option></select></span>
  <span>速度 <select id="selSpd"><option value="1">正常</option><option value="4">快进</option></select></span>
  <a id="btnAutoRun">模拟触发自动备份</a>
  <a id="reset">重置演示</a>
</div>
<div class="toast" id="toast"></div>
<script>
function $(id) { return document.getElementById(id); }
var KEY = 'yw_backup', VER = 'P1.5.0', PRJ = 'xhz';
var PARTS = ['基础数据', '飞行数据', '成果数据'];
var SIZE = { '基础数据': 1.2, '飞行数据': 36.5, '成果数据': 58.3 };
var REASON = { space: '剩余空间不足', net: '网络异常，云端上传失败', stop: '其他操作导致任务中断' };
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtD(d) { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function stamp(d) { d = new Date(d); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()); }
function isFull(c) { return c.length === 3; }
function cName(c) { return isFull(c) ? '全量数据' : c.join('+'); }
function sizeOf(c) { return Math.round(c.reduce(function (a, p) { return a + SIZE[p]; }, 0) * 10) / 10; }
function fmtDur(s) { return Math.floor(s / 60) + '分' + (s % 60) + '秒'; }
var seq = 1;
function mkRec(t, way, c, ok, reason, store) {
  return { id: seq++, name: VER + '_' + PRJ + '_' + cName(c) + '_' + stamp(t) + '.zip', way: way, content: c.slice(), size: ok ? sizeOf(c) : 0, time: t,
    store: store || '本地', dur: 20 + c.length * 35, ok: ok, reason: reason || '', status: ok ? '存在' : '—' };
}
function initState() {
  var D = 86400000, n = Date.now();
  var recs = [
    mkRec(n - 9 * D, '手动备份', PARTS), mkRec(n - 7 * D, '自动备份', ['基础数据', '飞行数据']),
    mkRec(n - 5 * D, '手动备份', ['基础数据']), mkRec(n - 4 * D, '手动备份', PARTS, false, REASON.space),
    mkRec(n - 2 * D, '自动备份', ['基础数据', '飞行数据'], true, '', '本地+云端')
  ];
  return { space: 3697.88, seq: seq, recs: recs,
    auto: { on: true, days: 7, time: '02:00', content: ['基础数据', '飞行数据'], mode: 'local', cloud: {} },
    man: {}, run: null };
}
var st; try { st = JSON.parse(localStorage.getItem(KEY)) || initState(); } catch (e) { st = initState(); }
(function () { var d = initState(); Object.keys(d).forEach(function (k) { if (st[k] === undefined) st[k] = d[k]; });
  Object.keys(d.auto).forEach(function (k) { if (st.auto[k] === undefined) st.auto[k] = d.auto[k]; });
  if (!document.querySelector('input[name=mode][value="' + st.auto.mode + '"]')) st.auto.mode = d.auto.mode; })();
seq = st.seq || 100;
function save() { st.seq = seq; localStorage.setItem(KEY, JSON.stringify(st)); }
function toast(msg, bad) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2200); }

/* ---------- 弹窗 ---------- */
function modal(t, b, btns) {
  $('mT').textContent = t; $('mB').innerHTML = b; $('mF').innerHTML = '';
  (btns || []).forEach(function (x) { var e = document.createElement('button'); e.className = 'btn' + (x.ghost ? ' ghost' : ''); e.textContent = x.t; e.onclick = function () { closeM(); if (x.fn) x.fn(); }; $('mF').appendChild(e); });
  $('mask').classList.add('open');
}
function closeM() { $('mask').classList.remove('open'); }
$('mX').onclick = function () { if (restoring) return; closeM(); };

/* ---------- 页签 ---------- */
var tab = 'auto', view = 'main';
function setTab(t) {
  tab = t;
  document.querySelectorAll('.tb2').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
  $('p-auto').style.display = t === 'auto' ? '' : 'none'; $('p-manual').style.display = t === 'manual' ? '' : 'none';
}
function show(v) {
  view = v; $('v-main').style.display = v === 'main' ? '' : 'none'; $('v-rec').style.display = v === 'rec' ? '' : 'none';
  $('crumb').innerHTML = v === 'rec' ? '备份 &gt;&gt; 备份记录' : '备份';
  render();
}

/* ---------- 自动备份表单 ---------- */
function fillAuto() {
  var a = st.auto;
  $('swAuto').classList.toggle('off', !a.on); $('autoBody').classList.toggle('off', !a.on);
  $('fDays').value = a.days; $('fTime').value = a.time;
  document.querySelectorAll('#p-auto input[type=checkbox]').forEach(function (c) { var n = c.getAttribute('data-c'); c.checked = n === '基础数据' || a.content.indexOf(n) >= 0; });
  document.querySelectorAll('input[name=mode]').forEach(function (r) { r.checked = r.value === a.mode; });
  ['exp', 'bucket', 'ep', 'cdn', 'sk', 'ak'].forEach(function (k) { $('c_' + k).value = a.cloud[k] || ''; $('c_' + k).classList.remove('err'); });
  syncCloud(); nextTime();
}
function syncCloud() { var m = document.querySelector('input[name=mode]:checked'); $('cloud').style.display = m && m.value === 'both' ? '' : 'none'; }
function nextTime() {
  if (!st.auto.on) { $('nextT').textContent = ''; return; }
  var days = Math.max(1, +$('fDays').value || 1), tm = ($('fTime').value || '02:00').split(':');
  var last = st.recs.filter(function (r) { return r.way === '自动备份'; }).pop();
  var base = new Date(last ? last.time : Date.now()); base.setDate(base.getDate() + days); base.setHours(+tm[0], +tm[1], 0, 0);
  $('nextT').textContent = '下次备份时间：' + fmtD(base);
}
/* ---------- 列表渲染 ---------- */
function alive() { return st.recs.filter(function (r) { return r.ok && r.status === '存在'; }); }
function lastMan(n) { var a = alive().filter(function (r) { return r.way === '手动备份' && cName(r.content) === n; }); return a[a.length - 1]; }
function renderData() {
  var list = alive().slice().reverse(), h = '';
  list.forEach(function (r, i) {
    h += '<tr><td>' + (i + 1) + '</td><td class="nm">' + r.name + '</td><td>' + r.way + '</td><td>' + cName(r.content) + '</td><td>' + r.size + 'GB</td><td>' + fmtD(r.time) + '</td>' +
      '<td><span class="lnk" data-del="' + r.id + '">删除</span><span class="lnk" data-rs="' + r.id + '">还原数据</span><span class="lnk" data-dl="' + r.id + '">下载</span></td></tr>';
  });
  $('tbData').innerHTML = h || '<tr><td colspan="7" class="empty">暂无备份数据</td></tr>';
}
function renderMan() {
  var rows = [['全量数据', PARTS]].concat(PARTS.map(function (p) { return [p, [p]]; })), h = '';
  rows.forEach(function (x, i) {
    var m = lastMan(x[0]), running = st.run && st.run.kind === 'man' && cName(st.run.content) === x[0];
    var s = running ? '<span class="st run">备份中</span>' : m ? '<span class="st ok">已备份</span>' : '<span class="st no">未备份</span>';
    h += '<tr><td>' + (i + 1) + '</td><td>' + x[0] + '</td><td>' + (m ? m.size + 'GB' : '—') + '</td><td>' + s + '</td><td>' + (m ? fmtD(m.time) : '—') + '</td>' +
      '<td><span class="lnk" data-bk="' + x[0] + '">备份</span>' + (m ? '<span class="lnk" data-mdl="' + x[0] + '">下载</span>' : '<span class="dis">下载</span>') + '</td></tr>';
  });
  $('tbMan').innerHTML = h;
}
function renderRec() {
  var h = '';
  st.recs.slice().reverse().forEach(function (r, i) {
    h += '<tr><td>' + (i + 1) + '</td><td class="nm">' + r.name + '</td><td>' + r.way + '</td><td>' + (isFull(r.content) ? '全量备份' : '部分备份') + '</td><td>' + r.store + '</td><td>' + (r.ok ? r.size + 'GB' : '—') + '</td><td>' + fmtD(r.time) + '</td><td>' + fmtDur(r.dur) + '</td>' +
      '<td>' + (r.ok ? '<span class="s-done">成功</span>' : '<span class="fail">失败：' + r.reason + '</span>') + '</td><td>' + r.status + '</td></tr>';
  });
  $('tbRec').innerHTML = h || '<tr><td colspan="10" class="empty">暂无备份记录</td></tr>';
}
function render() { $('space').textContent = st.space.toFixed(2) + 'GB'; if (view === 'rec') renderRec(); else { renderData(); renderMan(); } nextTime(); }

/* ---------- 备份执行 ---------- */
var timer = null;
function spinHtml(txt, pct) { return '<div class="spin"><div class="cl">◌</div><div>' + txt + '</div><div class="prog" style="margin:14px 0 0"><div class="main"><div class="row2"><div class="track"><div class="fill" id="spFill" style="width:' + pct + '%"></div></div><span class="pct" id="spPct">' + pct + '%</span></div></div></div></div>'; }
function startBk(kind, c) {
  var rs = +localStorage.getItem('yw_restoring') || 0, rr = null; try { rr = (JSON.parse(localStorage.getItem('yw_restore')) || {}).run; } catch (e) {} if ((rs && Date.now() - rs < 600000) || (rr && Date.now() < rr.end)) { toast('还原进行中，请稍后再备份', 1); return; }
  if (st.run || restoring) { toast('有备份或还原任务进行中，请稍后', 1); return; }
  var need = sizeOf(c);
  st.run = { kind: kind, content: c.slice(), pct: 0, t0: Date.now(), res: $('selRes').value, mode: st.auto.mode };
  if (st.run.res === 'net' && !(kind === 'auto' && st.auto.mode === 'both')) { st.run.res = 'ok'; toast('网络异常只在「本地+云端」自动备份时出现，本次按成功演示'); }
  if (need > st.space) st.run.res = 'space';
  save(); render();
  modal('备份中', spinHtml('正在备份「' + cName(c) + '」，请勿关闭页面…', 0), [{ t: '后台运行', ghost: true }]);
  tick();
}
function tick() {
  clearTimeout(timer);
  var r = st.run; if (!r) return;
  var failAt = r.res === 'ok' ? 101 : r.res === 'stop' ? 40 : r.res === 'net' ? 85 : 20;
  r.pct = Math.min(100, r.pct + 4 * (+$('selSpd').value || 1));
  if ($('spFill')) { $('spFill').style.width = r.pct + '%'; $('spPct').textContent = r.pct + '%'; }
  if (r.pct >= failAt) return endBk(false);
  if (r.pct >= 100) return endBk(true);
  save(); timer = setTimeout(tick, 300);
}
function endBk(ok) {
  var r = st.run, way = r.kind === 'auto' ? '自动备份' : '手动备份';
  var net = r.res === 'net'; if (net) ok = true; var mode = r.mode || st.auto.mode;
  var store = net ? '本地（云端上传失败）' : r.kind === 'auto' && mode === 'both' ? '本地+云端' : '本地';
  var rec = mkRec(Date.now(), way, r.content, ok, ok ? '' : REASON[r.res], store);
  rec.dur = Math.max(5, Math.round((Date.now() - r.t0) / 1000));
  st.recs.push(rec); st.run = null;
  if (ok) {
    st.space = Math.max(0, st.space - rec.size);
    if (r.kind === 'man') st.man[cName(r.content)] = { time: rec.time, size: rec.size };
    var fulls = alive().filter(function (x) { return isFull(x.content) && x.way === '手动备份'; });
    while (fulls.length > 5) { var o = fulls.shift(); o.status = '系统删除'; st.space += o.size; }
  }
  save(); render(); closeM();
  if (net) { modal('云端上传失败', '「' + cName(r.content) + '」已备份到本地，大小 ' + rec.size + 'GB。<br><span style="color:#e4393c">上传云端失败：网络异常</span>，请检查网络和云端存储参数。', [{ t: '确定' }]); return; }
  if (ok) modal('备份成功', '<div class="spin"><div class="cl okc">✔</div><div>「' + cName(r.content) + '」备份完成，大小 ' + rec.size + 'GB</div></div>', [{ t: '确定' }]);
  else modal('备份失败', '<div style="color:#e4393c;margin-bottom:6px">「' + cName(r.content) + '」备份失败</div>失败原因：' + REASON[r.res] + (r.res === 'space' ? '<br>请清理磁盘或删除旧的备份数据后重试。' : r.res === 'net' ? '<br>本地备份已保留，请检查网络后重试云端上传。' : '<br>请勿在备份过程中进行升级、还原、重置等操作。'), [{ t: '关闭', ghost: true }, { t: '重新备份', fn: function () { startBk(r.kind, r.content); } }]);
}
/* ---------- 删除 / 还原 / 下载 ---------- */
function findRec(id) { return st.recs.filter(function (r) { return r.id === +id; })[0]; }
function delRec(id) {
  var r = findRec(id); if (!r || r.status !== '存在') return;
  if (restoring) { toast('还原进行中，暂不能删除', 1); return; }
  modal('删除确认', '确定删除备份数据「' + r.name + '」吗？<br><span style="color:#e4393c">删除后不可恢复。</span>', [{ t: '取消', ghost: true }, { t: '删除', fn: function () {
    if (r.status !== '存在') return; r.status = '手动删除'; st.space += r.size; save(); render(); toast('已删除');
  } }]);
}
var rtimer = null, restoring = false;
function restoreRec(id) {
  var r = findRec(id); if (!r) return;
  if (st.run || restoring) { toast('有备份或还原任务进行中，请稍后', 1); return; }
  modal('还原数据', '<div style="line-height:2">备份数据：' + r.name + '<br>系统版本：' + VER + '　项目：' + PRJ + '<br>备份时间：' + fmtD(r.time) + '<br>备份内容：' + cName(r.content) +
    '</div><div style="color:#e4393c;margin-top:6px">还原会覆盖系统中对应的数据，还原期间请勿进行升级、备份、重置等操作。是否继续？</div>',
    [{ t: '取消', ghost: true }, { t: '确认还原', fn: function () { setTimeout(function () { runRestore(r); }, 0); } }]);
}
function runRestore(r) {
  restoring = true; var pct = 0;
  modal('恢复中', spinHtml('正在恢复「' + cName(r.content) + '」，请勿关闭页面…', 0), []);
  (function step() {
    pct = Math.min(100, pct + 5 * (+$('selSpd').value || 1));
    if ($('spFill')) { $('spFill').style.width = pct + '%'; $('spPct').textContent = pct + '%'; }
    if (pct < 100) { rtimer = setTimeout(step, 300); return; }
    restoring = false; closeM();
    modal('还原成功', '<div class="spin"><div class="cl okc">✔</div><div>「' + cName(r.content) + '」已恢复到系统中</div></div>', [{ t: '确定' }]);
  })();
}
function dlRec(name) { toast('开始下载：' + name); }

/* ---------- PRD 标注 ---------- */
var NOTES = {
  tab: ['页签与空间', '分「自动备份」「手动备份」两个页签。顶部显示当前系统版本和本地剩余空间，点 ↻ 重新读取剩余空间。'],
  auto: ['自动备份开关', '默认开启。关闭后下方配置置灰不可编辑，系统不再自动备份。'],
  time: ['自动备份时间', '每 N 日（1–30）在指定时间点执行一次。右侧显示下次备份时间 = 上次自动备份时间 + N 日。'],
  content: ['备份内容', '基础数据影响系统运行，为必选项，不可取消；飞行数据、成果数据可选。'],
  mode: ['备份文件方式', '本地备份：只存云盒本地。本地+云端：本地存一份，同时上传云端对象存储，需填写存储参数，带 * 为必填，保存时校验。云端上传失败时本地备份仍保留。'],
  manual: ['手动备份', '「全量备份」= 基础 + 飞行 + 成果数据；也可在列表中单独备份某一类。备份中弹出进度，可点「后台运行」关闭弹窗；同一时间只允许一个备份任务。剩余空间不足时直接失败。'],
  data: ['备份数据', '列出现存的成功备份。手动全量备份最多保留 5 份，超出时系统自动删除最早的一份（记录状态为「系统删除」）。'],
  op: ['操作', '删除：二次确认，状态记为「手动删除」并释放空间。还原数据：确认备份信息后覆盖系统数据，显示恢复进度。下载：下载 zip 包到本地。'],
  rec: ['备份记录', '记录每次备份，包括失败的。失败原因：剩余空间不足 / 网络异常 / 其他操作导致任务中断。数据状态：存在 / 系统删除 / 手动删除。']
};
NOTES.ops = NOTES.op;
var dotsOn = localStorage.getItem('yw_dots') !== '0';
function syncDots() { $('swDots').classList.toggle('off', !dotsOn); document.querySelectorAll('.dot').forEach(function (d) { d.style.display = dotsOn ? '' : 'none'; }); if (!dotsOn) $('pop').style.display = 'none'; }
function openNote(btn) {
  var n = NOTES[btn.getAttribute('data-note')] || ['说明', '（待补充）'], p = $('pop'), rc = btn.getBoundingClientRect();
  $('popT').textContent = n[0]; $('popB').innerHTML = n[1]; p.style.display = 'block';
  var left = Math.min(window.innerWidth - p.offsetWidth - 10, rc.right + 8);
  p.style.position = 'fixed'; p.style.left = Math.max(10, left) + 'px'; p.style.top = Math.min(window.innerHeight - p.offsetHeight - 10, rc.top) + 'px';
}

/* ---------- 事件 ---------- */
document.addEventListener('click', function (e) {
  var t = e.target, a;
  if (t.classList.contains('dot')) { e.stopPropagation(); openNote(t); return; }
  if ((a = t.getAttribute('data-tab'))) { setTab(a); return; }
  if ((a = t.getAttribute('data-del'))) { delRec(a); return; }
  if ((a = t.getAttribute('data-rs'))) { restoreRec(a); return; }
  if ((a = t.getAttribute('data-dl'))) { var r = findRec(a); if (r) dlRec(r.name); return; }
  if ((a = t.getAttribute('data-bk'))) { startBk('man', a === '全量数据' ? PARTS : [a]); return; }
  if ((a = t.getAttribute('data-mdl'))) { var lm = lastMan(a); if (lm) dlRec(lm.name); return; }
});
$('popX').onclick = function () { $('pop').style.display = 'none'; };
$('swDots').onclick = function () { dotsOn = !dotsOn; localStorage.setItem('yw_dots', dotsOn ? '1' : '0'); syncDots(); };
$('btnFull').onclick = function () { startBk('man', PARTS); };
$('btnRec').onclick = function () { show('rec'); };
$('btnBack').onclick = function () { if (view === 'rec') show('main'); else location.href = 'home.html'; };
$('goHome').onclick = function () { location.href = 'home.html'; };
$('btnRf').onclick = function () { render(); toast('剩余空间已刷新'); };
$('swAuto').onclick = function () { st.auto.on = !st.auto.on; save(); fillAuto(); toast(st.auto.on ? '已开启自动备份' : '已关闭自动备份'); };
$('fDays').oninput = $('fTime').oninput = nextTime;
document.querySelectorAll('input[name=mode]').forEach(function (r) { r.onchange = syncCloud; });
$('btnSave').onclick = function () {
  var days = +$('fDays').value;
  if (!(days >= 1 && days <= 30) || days % 1) { toast('备份间隔需为 1–30 日', 1); return; }
  var mode = document.querySelector('input[name=mode]:checked').value, bad = 0, cloud = {};
  ['exp', 'bucket', 'ep', 'cdn', 'sk', 'ak'].forEach(function (k) {
    var el = $('c_' + k), v = el.value.trim(); cloud[k] = v;
    var err = mode === 'both' && k !== 'cdn' && !v; el.classList.toggle('err', err); if (err) bad++;
  });
  if (bad) { toast('请填写完整的云端存储参数', 1); return; }
  st.auto.days = days; st.auto.time = $('fTime').value || '02:00'; st.auto.mode = mode; st.auto.cloud = cloud;
  st.auto.content = ['基础数据'].concat([].filter.call(document.querySelectorAll('#p-auto input[data-c]'), function (c) { return c.checked && c.getAttribute('data-c') !== '基础数据'; }).map(function (c) { return c.getAttribute('data-c'); }));
  save(); nextTime(); toast('保存成功');
};
$('btnAutoRun').onclick = function () { if (!st.auto.on) { toast('自动备份已关闭', 1); return; } startBk('auto', st.auto.content); };
$('reset').onclick = function () { if (st.run || restoring) { toast('任务进行中，请稍后重置', 1); return; } localStorage.removeItem(KEY); seq = 1; st = initState(); save(); fillAuto(); show('main'); toast('已重置演示数据'); };

/* ---------- 初始化 ---------- */
var qs = location.search;
setTab(/tab=manual/.test(qs) ? 'manual' : 'auto');
fillAuto(); syncDots(); show('main');
if (st.run) { modal('备份中', spinHtml('正在备份「' + cName(st.run.content) + '」，请勿关闭页面…', st.run.pct), [{ t: '后台运行', ghost: true }]); tick(); }
</script>
</body>
</html>
