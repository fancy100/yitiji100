<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维中心 · 初始化 · 网络信息配置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; color: #333; background: #eef0f3; }
  .topbar { height: 50px; background: #1a6cfb; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .topbar .logo { font-size: 18px; }
  .topbar .right { display: flex; align-items: center; gap: 28px; }
  .topbar .entry, .topbar .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .topbar .ico { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #1a6cfb; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
  .titlebar { height: 42px; background: #fff; display: flex; align-items: center; padding: 0 22px; border-bottom: 1px solid #eee; }
  .titlebar .back { font-size: 18px; margin-right: 18px; cursor: pointer; }
  .titlebar h1 { font-size: 17px; font-weight: bold; }
  .steps { background: #fff; display: flex; height: 56px; border-bottom: 1px solid #e6e6e6; }
  .step { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; color: #999; position: relative; font-size: 15px; }
  .step:not(:last-child)::after { content: "›"; position: absolute; right: 0; font-size: 22px; color: #bbb; }
  .step .num { width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; color: #666; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .step.active { color: #333; border-bottom: 2px solid #1a6cfb; }
  .step.active .num { background: #1a6cfb; color: #fff; }
  .card { max-width: 1320px; margin: 20px auto 30px; background: #fff; padding: 70px 0 50px; min-height: 760px; }
  .form { width: 640px; margin: 0 auto; }
  .row { display: flex; align-items: center; margin-bottom: 26px; }
  .row label { width: 150px; text-align: right; padding-right: 10px; flex-shrink: 0; }
  .row label .req { color: #e4393c; margin-right: 4px; }
  .row .ctrl { flex: 1; position: relative; }
  .row input[type=text] { width: 100%; height: 34px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; transition: border .2s; }
  .row input[type=text]:focus { border-color: #1a6cfb; }
  .row input.err { border-color: #e4393c; }
  .row .msg { position: absolute; left: 0; top: 36px; color: #e4393c; font-size: 12px; }
  .row .hint { color: #999; font-size: 12px; margin-top: 6px; }
  .tip-box { margin: -6px 0 26px 150px; padding: 10px 12px; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 4px; color: #8a6d00; font-size: 12px; line-height: 1.8; }
  .upload { display: inline-flex; align-items: center; justify-content: center; width: 140px; height: 36px; background: #81d3f8; border-radius: 4px; cursor: pointer; font-size: 18px; color: #fff; vertical-align: middle; }
  .upload:hover { background: #5fc3f1; }
  .file-chip { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px; background: #f5f7fa; border: 1px solid #dcdfe6; border-radius: 4px; vertical-align: middle; }
  .file-chip .x { cursor: pointer; color: #999; font-weight: bold; }
  .file-chip .x:hover { color: #e4393c; }
  .progress { font-size: 12px; color: #1a6cfb; margin-left: 10px; }
  .footer { text-align: center; margin-top: 40px; }
  .btn { height: 36px; padding: 0 30px; border-radius: 4px; border: none; background: #1a6cfb; color: #fff; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #3d82ff; }
  /* PRD 标注点 */
  .dot { position: absolute; right: -32px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: #ff7a00; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; border: none; animation: pulse 1.8s infinite; }
  .dot.inline { position: relative; right: auto; top: auto; transform: none; display: inline-flex; margin-left: 10px; vertical-align: middle; }
  .dot.open { background: #1a6cfb; animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,122,0,.55); } 70% { box-shadow: 0 0 0 9px rgba(255,122,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,122,0,0); } }
  body.hide-dots .dot { display: none !important; }
  .pop { position: absolute; width: 380px; background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 50; font-size: 13px; line-height: 1.7; display: none; }
  .pop.show { display: block; }
  .pop .hd { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
  .pop .hd .close { cursor: pointer; color: #999; font-weight: normal; }
  .pop .bd { padding: 10px 14px 12px; max-height: 440px; overflow: auto; }
  .note { padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; }
  .note:last-child { margin-bottom: 0; }
  .note .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; margin-right: 6px; background: rgba(255,255,255,.75); }
  .note .ver { float: right; font-size: 11px; color: #888; }
  .note.rule { background: #fff6c2; border-left: 3px solid #ffdf25; }
  .note.change { background: #ffffd6; border-left: 3px solid #e6e600; }
  .note.reason { background: #f0f0f0; border-left: 3px solid #bdbdbd; }
  .note.old { opacity: .6; }
  .note table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; background: #fff; }
  .note th, .note td { border: 1px solid #e5e5e5; padding: 3px 6px; text-align: left; }
  .note th { background: #fafafa; }
  .ctrl-panel { position: fixed; left: 20px; bottom: 20px; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 14px; font-size: 13px; z-index: 60; display: flex; align-items: center; gap: 12px; }
  .ctrl-panel a { color: #1a6cfb; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; background: #1a6cfb; border-radius: 10px; cursor: pointer; transition: .2s; }
  .switch::after { content: ""; position: absolute; left: 18px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch.off { background: #ccc; }
  .switch.off::after { left: 2px; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 22px; border-radius: 4px; display: none; z-index: 99; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">运维中心</div>
  <div class="right">
    <div class="entry"><span class="ico">⌂</span>功能入口</div>
    <div class="user"><span class="ico">A</span>admin ▾</div>
  </div>
</div>

<div class="titlebar">
  <span class="back">←</span>
  <h1>初始化</h1>
  <button class="dot inline" data-note="global" title="查看 PRD 标注">1</button>
</div>

<div class="steps">
  <div class="step active"><span class="num">1</span>网络信息配置</div>
  <div class="step"><span class="num">2</span>设备激活配置</div>
  <div class="step"><span class="num">3</span>基础服务配置</div>
  <div class="step"><span class="num">4</span>项目信息配置</div>
  <div class="step"><span class="num">5</span>可选服务配置</div>
  <div class="step"><span class="num">6</span>系统初始化</div>
</div>

<div class="card">
  <div class="form">
    <div class="row"><label><span class="req">*</span>IP：</label>
      <div class="ctrl"><input type="text" id="f_ip" data-type="ip"><span class="msg"></span>
        <button class="dot" data-note="net" title="查看 PRD 标注">2</button></div></div>
    <div class="row"><label><span class="req">*</span>子网掩码：</label>
      <div class="ctrl"><input type="text" id="f_mask" data-type="ip"><span class="msg"></span>
        <button class="dot" data-note="mask" title="查看 PRD 标注">3</button></div></div>
    <div class="row"><label><span class="req">*</span>网关：</label>
      <div class="ctrl"><input type="text" id="f_gw" data-type="ip"><span class="msg"></span></div></div>
    <div class="row"><label><span class="req">*</span>DNS1：</label>
      <div class="ctrl"><input type="text" id="f_dns1" data-type="ip"><span class="msg"></span></div></div>
    <div class="row"><label><span class="req">*</span>DNS2：</label>
      <div class="ctrl"><input type="text" id="f_dns2" data-type="ip"><span class="msg"></span></div></div>

    <div class="row" style="margin-top:40px"><label><span class="req">*</span>平台访问端口：</label>
      <div class="ctrl"><input type="text" id="f_port" data-type="port" value="443" style="width:160px"><span class="msg"></span>
        <button class="dot" data-note="port" style="right:auto;left:172px" title="查看 PRD 标注">4</button></div></div>
    <div class="tip-box">内网端口映射：尽量不用 80/443 端口，避免与 http/https 服务冲突或被扫描攻击。<br>互联网端口映射：80/443 端口若要使用，需要完成网络备案。</div>

    <div class="row" style="margin-top:40px; align-items:flex-start"><label style="padding-top:8px">域名SSL证书<br>（公钥pem文件）：</label>
      <div class="ctrl" id="up_pem"></div></div>
    <div class="row" style="align-items:flex-start"><label style="padding-top:8px">域名SSL证书<br>（私钥key文件）：</label>
      <div class="ctrl" id="up_key"></div></div>

    <div class="footer"><button class="btn" id="btnNext">下一步</button></div>
  </div>
</div>

<div class="pop" id="pop"><div class="hd"><span id="popTitle"></span><span class="close" id="popClose">✕</span></div><div class="bd" id="popBody"></div></div>

<div class="ctrl-panel">PRD 标注 <div class="switch" id="sw" title="显示 / 隐藏标注点"></div><a id="reset" title="清除本地演示数据，重新演示自动获取 DHCP">重置演示</a></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePicker" style="display:none">

<script>
// PRD 标注数据，来源：Axure 原型 B0.1.2 / B0.1.3 / B1.2.1
// cls：rule=规则（亮黄） change=修改说明（浅黄） reason=设计原因（灰）
var NOTES = {
  global: { title: '页面说明', items: [
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '激活、配置、重置模块的网络信息页都要同步修改。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '激活页面、配置页面同步改造。' }
  ]},
  net: { title: 'IP / 网关 / DNS1 / DNS2', items: [
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '去掉【获取DHCP】按钮，页面加载时自动获取 DHCP 数值：<br>· IP、子网掩码、网关、DNS1、DNS2 字段<b>无值</b>时，自动获取 DHCP 并填充；<br>· 字段<b>已有值</b>时，不再自动获取。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '自动获取后的字段支持编辑，并校验格式。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '激活成功后，IP、子网掩码、网关、DNS 字段仍支持修改；配置模块、重置模块同步支持展示。<br>内网模式下的访问地址，从 IP 获取后支持修改。' },
    { cls: 'rule old', tag: '已废弃', ver: 'B1.3.0', html: '<s>置灰数据不可修改，若要修改需在重置模块进行重启。</s>（B0.1.3 起改为支持修改）' }
  ]},
  mask: { title: '子网掩码', items: [
    { cls: 'change', tag: '修改', ver: 'B1.3.0', html: '子网掩码组件变更为<b>输入文本框</b>。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '与 IP 字段一致：页面加载自动获取 DHCP，获取后支持编辑并校验格式。' }
  ]},
  port: { title: '平台访问端口', items: [
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '默认端口 443。系统各服务使用的端口如下（互联网模式下需做端口映射）：' +
      '<table><tr><th>端口</th><th>协议</th><th>用途</th></tr>' +
      '<tr><td>443</td><td>tcp</td><td>平台页面</td></tr>' +
      '<tr><td>1883</td><td>tcp</td><td>无人机通讯接口</td></tr>' +
      '<tr><td>9000</td><td>tcp</td><td>素材管理</td></tr>' +
      '<tr><td>21935</td><td>tcp</td><td>直播数据推流</td></tr>' +
      '<tr><td>18000</td><td>rtc</td><td>直播数据拉流（默认 18000，互联网模式需映射端口与内部端口一致）</td></tr>' +
      '<tr><td>11554</td><td>rtsp</td><td>直播数据拉流（单兵设备使用 AI 功能直播）</td></tr>' +
      '<tr><td>8000</td><td>tcp</td><td>建图服务端口</td></tr></table>' },
    { cls: 'change', tag: '修改', ver: 'B1.3.0', html: '下方端口映射提示文字按新版调整。' },
    { cls: 'reason', tag: '原因', ver: 'B1.3.0', html: '内网端口映射尽量不用 80/443，避免与 http/https 服务冲突或被扫描攻击；互联网使用 80/443 需要网络备案。' }
  ]},
  cert: { title: '域名SSL证书', items: [
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '点击【+】选择文件后<b>立即执行上传</b>。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '点击文件后的【X】关闭文件，退回上传前的状态。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '可以修改证书内容，并新增提示语：若不上传，系统采用默认证书。' }
  ]}
};

// ===== 标注点弹层 =====
var pop = document.getElementById('pop'), curDot = null;
function openNote(dot) {
  if (curDot === dot) return closeNote();
  closeNote();
  var n = NOTES[dot.dataset.note];
  document.getElementById('popTitle').textContent = n.title;
  document.getElementById('popBody').innerHTML = n.items.map(function (it) {
    return '<div class="note ' + it.cls + '"><span class="tag">' + it.tag + '</span><span class="ver">' + it.ver + '</span>' + it.html + '</div>';
  }).join('');
  pop.classList.add('show');
  var r = dot.getBoundingClientRect();
  var left = r.right + 10 + window.scrollX, top = r.top - 10 + window.scrollY;
  if (r.right + 400 > document.documentElement.clientWidth) left = r.left - 390 + window.scrollX;
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  dot.classList.add('open'); curDot = dot;
}
function closeNote() { pop.classList.remove('show'); if (curDot) curDot.classList.remove('open'); curDot = null; }
document.addEventListener('click', function (e) {
  var d = e.target.closest('.dot');
  if (d) { e.stopPropagation(); openNote(d); return; }
  if (!pop.contains(e.target)) closeNote();
});
document.getElementById('popClose').onclick = closeNote;
document.getElementById('sw').onclick = function () { this.classList.toggle('off'); document.body.classList.toggle('hide-dots'); closeNote(); };

function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 2200); }

// ===== 页面加载：字段无值时自动获取 DHCP 并填充 =====
var STORE = 'yw_step1';
var DHCP = { f_ip: '192.168.1.100', f_mask: '255.255.255.0', f_gw: '192.168.1.1', f_dns1: '114.114.114.114', f_dns2: '8.8.8.8' };
var saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
Object.keys(DHCP).forEach(function (id) { document.getElementById(id).value = saved ? (saved[id] || '') : ''; });
if (saved && saved.f_port) document.getElementById('f_port').value = saved.f_port;
if (!saved) setTimeout(function () {
  Object.keys(DHCP).forEach(function (id) { var i = document.getElementById(id); if (!i.value) i.value = DHCP[id]; });
  toast('已自动获取 DHCP 网络信息');
}, 600);
document.getElementById('reset').onclick = function () { localStorage.removeItem(STORE); location.reload(); };

// ===== 格式校验 =====
var IPRE = /^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/;
function check(inp) {
  var v = inp.value.trim(), t = inp.dataset.type, m = '';
  if (!v) m = '此项为必填项';
  else if (t === 'ip' && !IPRE.test(v)) m = '格式不正确，示例：192.168.1.100';
  else if (t === 'port' && !(/^\d+$/.test(v) && +v >= 1 && +v <= 65535)) m = '端口范围 1-65535';
  inp.classList.toggle('err', !!m);
  inp.parentNode.querySelector('.msg').textContent = m;
  return !m;
}
document.querySelectorAll('.form input[type=text]').forEach(function (i) { i.addEventListener('blur', function () { check(i); }); });

// ===== 证书上传：选择文件即上传，X 关闭后退回上一状态 =====
var picker = document.getElementById('filePicker'), target = null;
function renderUpload(boxId, accept, fname) {
  var box = document.getElementById(boxId);
  var dot = boxId === 'up_pem' ? '<button class="dot inline" data-note="cert" title="查看 PRD 标注">5</button>' : '';
  if (!fname) {
    box.innerHTML = '<span class="upload" data-box="' + boxId + '" data-accept="' + accept + '">+</span>' + dot + '<div class="hint">若是不上传则会采用默认证书</div>';
  } else {
    box.innerHTML = '<span class="file-chip">📄 <span class="fn"></span><span class="x" data-box="' + boxId + '" data-accept="' + accept + '">X</span></span>' + dot + '<div class="hint" style="color:#52c41a">上传成功</div>';
    box.querySelector('.fn').textContent = fname;
  }
}
renderUpload('up_pem', '.pem,.crt', null);
renderUpload('up_key', '.key', null);
document.querySelector('.form').addEventListener('click', function (e) {
  var d = e.target.dataset;
  if (e.target.classList.contains('upload')) { target = { box: d.box, accept: d.accept }; picker.accept = d.accept; picker.value = ''; picker.click(); }
  if (e.target.classList.contains('x')) renderUpload(d.box, d.accept, null);
});
picker.onchange = function () {
  if (!picker.files.length || !target) return;
  var name = picker.files[0].name, t = target, box = document.getElementById(t.box);
  box.innerHTML = '<span class="file-chip">📄 上传中…</span><span class="progress">0%</span>';
  var p = 0, pr = box.querySelector('.progress');
  var h = setInterval(function () { p += 25; pr.textContent = p + '%'; if (p >= 100) { clearInterval(h); renderUpload(t.box, t.accept, name); } }, 200);
};

// ===== 下一步 =====
document.getElementById('btnNext').onclick = function () {
  var ok = true;
  document.querySelectorAll('.form input[type=text]').forEach(function (i) { if (!check(i)) ok = false; });
  if (!ok) return toast('请检查标红字段');
  var data = {};
  Object.keys(DHCP).concat('f_port').forEach(function (id) { data[id] = document.getElementById(id).value.trim(); });
  localStorage.setItem(STORE, JSON.stringify(data));
  toast('已保存。第二步「设备激活配置」还没做');
};
</script>
</body>
</html>
