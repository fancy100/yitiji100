<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运维中心 · 初始化 · 可选服务配置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; color: #333; background: #eef0f3; }
  .topbar { height: 50px; background: #1a6cfb; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .topbar .logo { font-size: 18px; }
  .topbar .right { display: flex; align-items: center; gap: 28px; }
  .topbar .entry, .topbar .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .topbar .ico { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #1a6cfb; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
  .titlebar { height: 42px; background: #fff; display: flex; align-items: center; padding: 0 22px; border-bottom: 1px solid #eee; }
  .titlebar .back { font-size: 18px; margin-right: 18px; cursor: pointer; }
  .titlebar h1 { font-size: 17px; font-weight: bold; }
  .steps { background: #fff; display: flex; height: 56px; border-bottom: 1px solid #e6e6e6; }
  .step { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; color: #999; position: relative; font-size: 15px; }
  .step:not(:last-child)::after { content: "›"; position: absolute; right: 0; font-size: 22px; color: #bbb; }
  .step .num { width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; color: #666; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .step.done { color: #333; }
  .step.done .num, .step.active .num { background: #1a6cfb; color: #fff; }
  .step.active { color: #333; border-bottom: 2px solid #1a6cfb; }
  .card { max-width: 1320px; margin: 20px auto 30px; background: #fff; padding: 30px 0 40px; }
  .wrap { width: 760px; margin: 0 auto; }
  .row { display: flex; align-items: flex-start; margin-bottom: 16px; }
  .row label.lb { width: 130px; text-align: right; padding: 7px 10px 0 0; flex-shrink: 0; }
  .req { color: #e4393c; margin-right: 3px; }
  .row .ctrl { flex: 1; position: relative; max-width: 480px; }
  .hint { color: #999; font-size: 12px; margin-top: 4px; line-height: 1.6; }
  .warn { color: #e4393c; font-size: 12px; margin-top: 6px; line-height: 1.6; }
  input[type=text], input[type=password] { width: 100%; height: 34px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 10px; font-size: 14px; outline: none; }
  input:focus { border-color: #1a6cfb; }
  input.ro, input[readonly] { background: #f0f0f0; color: #777; cursor: not-allowed; }
  input.bad, .opts.bad, .ntbl.bad { border-color: #e4393c !important; outline: 1px solid #e4393c; }
  .err { color: #e4393c; font-size: 12px; margin-top: 4px; }
  .btn { height: 36px; padding: 0 30px; border-radius: 4px; border: none; background: #1a6cfb; color: #fff; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #3d82ff; }
  .btn:disabled, .btn:disabled:hover { background: #f0f0f0; color: #bbb; border: 1px solid #ddd; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: #333; border: 1px solid #d9d9d9; }
  .btn.ghost:hover { color: #1a6cfb; border-color: #1a6cfb; }
  .btn.light { background: #d6ecff; color: #1a6cfb; }
  .footer { margin-top: 30px; display: flex; justify-content: center; gap: 12px; align-items: center; }
  /* 云端资源授权码 */
  .auth { background: #f5f6f8; border-radius: 4px; padding: 20px 20px 16px; margin-bottom: 20px; position: relative; }
  .auth .line { display: flex; gap: 12px; align-items: flex-start; }
  .auth .line .ctrl { flex: 1; }
  .auth .vbtn { text-align: center; margin-top: 14px; }
  .quota { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; background: #fff; border-radius: 4px; padding: 16px 24px; margin-top: 16px; }
  .quota .k { color: #555; font-size: 13px; }
  .quota .v { margin-top: 4px; }
  .quota .v b { color: #1a6cfb; font-size: 22px; margin-right: 10px; }
  .quota .v span { color: #666; font-size: 12px; }
  .quota .zero b { color: #bbb; }
  /* 服务模块 */
  .mod { margin-bottom: 14px; }
  .mhead { height: 38px; border-radius: 6px; background: linear-gradient(90deg, #1a6cfb, #6aa6ff 50%, #e3eeff); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-weight: bold; font-size: 15px; }
  .mhead .ttl { display: flex; align-items: center; }
  .mhead .ttl::before { content: "//"; margin-right: 8px; font-style: italic; }
  .sw { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: normal; color: #1a6cfb; background: #fff; border-radius: 10px; padding: 2px 3px 2px 8px; }
  .sw i { width: 16px; height: 16px; border-radius: 50%; background: #1a6cfb; }
  .sw.off { color: #999; flex-direction: row-reverse; padding: 2px 8px 2px 3px; background: #ddd; }
  .sw.off i { background: #fff; }
  .mbody { padding: 16px 0 4px; }
  .opts { display: flex; gap: 14px; flex: 1; max-width: 560px; border-radius: 4px; }
  .opt { flex: 1; border: 1px solid #c8c8c8; border-radius: 4px; padding: 8px 12px; cursor: pointer; background: #fff; }
  .opt .t { display: flex; align-items: center; gap: 6px; }
  .opt .t::before { content: ""; width: 12px; height: 12px; border: 1px solid #999; border-radius: 50%; flex-shrink: 0; }
  .opt .s { font-size: 12px; color: #888; margin-top: 6px; }
  .opt.on { border-color: #1a6cfb; background: #e8f1ff; }
  .opt.on .t::before { border: 4px solid #1a6cfb; width: 6px; height: 6px; }
  .opt.dis { background: #f5f5f5; color: #bbb; cursor: not-allowed; border-style: dashed; }
  .opt.dis .s { color: #ccc; }
  .ntbl { width: 480px; border-collapse: collapse; margin: 6px 0 0 130px; font-size: 13px; }
  .ntbl th, .ntbl td { border: 1px solid #ccc; padding: 7px 8px; text-align: center; }
  .ntbl th { background: #fafafa; font-weight: normal; }
  .ntbl label { margin: 0 8px; cursor: pointer; }
  .nbtn { margin: 6px 0 10px 130px; }
  /* PRD 标注点 */
  .dot { position: absolute; right: -32px; top: 8px; width: 20px; height: 20px; border-radius: 50%; background: #ff7a00; color: #fff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; border: none; animation: pulse 1.8s infinite; }
  .dot.inline { position: relative; right: auto; top: auto; display: inline-flex; margin-left: 10px; }
  .dot.open { background: #1a6cfb; animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,122,0,.55); } 70% { box-shadow: 0 0 0 9px rgba(255,122,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,122,0,0); } }
  body.hide-dots .dot { display: none !important; }
  .pop { position: absolute; width: 720px; max-width: calc(100vw - 24px); background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 50; font-size: 13px; line-height: 1.7; display: none; }
  .pop.show { display: block; }
  .pop .hd { padding: 10px 14px; border-bottom: 1px solid #eee; font-weight: bold; display: flex; justify-content: space-between; }
  .pop .hd .close { cursor: pointer; color: #999; font-weight: normal; }
  .pop .bd { padding: 10px 14px 12px; max-height: 460px; overflow: auto; }
  .note { padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; background: #fff6c2; border-left: 3px solid #ffdf25; }
  .note:last-child { margin-bottom: 0; }
  .note .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; margin-right: 6px; background: rgba(255,255,255,.75); }
  .note .ver { float: right; font-size: 11px; color: #888; }
  .note table { width: 100%; border-collapse: collapse; margin-top: 6px; background: #fff; font-size: 12px; line-height: 1.5; }
  .note th, .note td { border: 1px solid #e3d98a; padding: 4px 6px; text-align: left; vertical-align: top; }
  .note th { background: #fff1a8; white-space: nowrap; }
  .ctrl-panel { position: fixed; left: 20px; bottom: 20px; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px 14px; font-size: 13px; z-index: 60; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 600px; }
  .ctrl-panel select { height: 24px; font-size: 12px; }
  .ctrl-panel .codes { width: 100%; color: #888; font-size: 12px; }
  .switch { position: relative; width: 36px; height: 20px; background: #1a6cfb; border-radius: 10px; cursor: pointer; }
  .switch::after { content: ""; position: absolute; left: 18px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .switch.off { background: #ccc; }
  .switch.off::after { left: 2px; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 10px 22px; border-radius: 4px; display: none; z-index: 99; max-width: 620px; text-align: center; }
  .toast.bad { background: #fff1f0; color: #e4393c; border: 1px solid #ffa39e; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 80; }
  .mask.open { display: flex; }
  .modal { background: #fff; border-radius: 6px; width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .modal .mhd { padding: 14px 20px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }
  .modal .mhd .close { cursor: pointer; color: #999; font-weight: normal; }
  .modal .mbd { padding: 18px 20px; line-height: 1.8; }
  .modal .mft { padding: 10px 20px 16px; text-align: right; }
  .bk-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 200; }
  .bk-mask.open { display: flex; }
  .bk-modal { width: 420px; background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.2); color: #333; }
  .bk-hd { padding: 14px 20px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; }
  .bk-hd .bk-x { cursor: pointer; color: #999; font-weight: normal; }
  .bk-bd { padding: 22px 20px; font-size: 14px; line-height: 1.7; }
  .bk-ft { padding: 10px 20px 16px; text-align: right; }
  .bk-ft button { min-width: 88px; height: 32px; margin-left: 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .bk-ft .bk-ghost { background: #fff; border: 1px solid #d9d9d9; color: #333; }
  .bk-ft .bk-ok { background: #1a6cfb; border: 1px solid #1a6cfb; color: #fff; }
</style>
</head>
<body>
<div class="topbar"><div class="logo">运维中心</div><div class="right"><div class="entry"><span class="ico">⌂</span>功能入口</div><div class="user"><span class="ico">A</span>admin ⌄</div></div></div>
<div class="titlebar"><span class="back" onclick="openBack()" title="返回">←</span><h1>初始化</h1></div>
<div class="steps">
  <div class="step done"><span class="num">1</span>网络信息配置</div>
  <div class="step done"><span class="num">2</span>设备激活配置</div>
  <div class="step done"><span class="num">3</span>基础服务配置</div>
  <div class="step done"><span class="num">4</span>项目信息配置</div>
  <div class="step active"><span class="num">5</span>可选服务配置</div>
  <div class="step"><span class="num">6</span>系统初始化</div>
</div>

<div class="card"><div class="wrap">
  <!-- 云端资源授权码 -->
  <div class="auth" id="auth">
    <div class="row" style="margin-bottom:0"><label class="lb">云端资源授权码：</label>
      <div class="ctrl" style="max-width:none"><div class="line"><div class="ctrl"><input type="text" id="code" placeholder="请输入云端资源授权码" maxlength="32"></div><button class="btn" id="btnReplace" style="display:none;padding:0 18px">替换授权码</button></div>
        <div class="hint">云端服务需要联网验证</div><div class="err" id="codeErr"></div><button class="dot" data-note="code">1</button></div></div>
    <div class="vbtn" id="vbtnWrap"><button class="btn" id="btnVerify" disabled style="padding:0 18px">验证授权码</button><button class="dot inline" data-note="verify">2</button></div>
    <div id="quotaWrap" style="display:none">
      <div class="quota" id="quota"></div>
      <div class="hint" style="margin-top:10px;color:#666">提示：若是需要增加额度，可联系商务或者官方客服增加。<button class="dot inline" data-note="quota">3</button></div>
    </div>
  </div>

  <div id="mods"></div>

  <div class="footer"><button class="btn ghost" id="btnPrev">上一步</button><button class="btn" id="btnNext">暂存并下一步</button><button class="dot inline" data-note="save">9</button></div>
</div></div>

<div class="pop" id="pop"><div class="hd"><span id="popT"></span><span class="close" id="popX">✕</span></div><div class="bd" id="popB"></div></div>

<div class="mask" id="mask"><div class="modal">
  <div class="mhd"><span id="mT">提示</span><span class="close" id="mX">✕</span></div>
  <div class="mbd" id="mB"></div>
  <div class="mft" id="mF"></div>
</div></div>

<div class="ctrl-panel">
  <span>PRD 标注</span><div class="switch" id="swDots"></div>
  <span>必填验证</span><div class="switch" id="swVal" title="开启 / 关闭必填验证"></div>
  <span>网络环境 <select id="selNet"><option value="1">已联网</option><option value="0">无网</option></select></span>
  <span>本机 AI 硬件 <select id="selAiHw"><option value="1">已检测到</option><option value="0">未检测到</option></select></span>
  <span>本地 ODM 建图 <select id="selOdm"><option value="1">已安装</option><option value="0">未安装</option></select></span>
  <span>本地建模服务 <select id="sel3d"><option value="1">已安装</option><option value="0">未安装</option></select></span>
  <span>独立服务接口 <select id="selApi"><option value="">全部通过</option><option value="ai">AI识别不通过</option><option value="m2d">二维建图不通过</option><option value="m3d">三维建模不通过</option><option value="cmp">AI比对不通过</option><option value="all">全部不通过</option></select></span>
  <span>独立服务连接 <select id="selConn"><option value="ok">验证通过</option><option value="err">验证不通过</option></select></span>
  <div class="codes">演示授权码：MYUWVYTV（同截图额度）、LMALL888（全部有额度）、LMZERO00（额度全为 0），其他输入视为无效</div>
</div>
<div class="bk-mask" id="bkMask"><div class="bk-modal">
  <div class="bk-hd"><span>提示</span><span class="bk-x" id="bkX">✕</span></div>
  <div class="bk-bd">您当前的修改内容未重启、未激活，若返回则不会保存，是否继续返回？</div>
  <div class="bk-ft"><button class="bk-ghost" id="bkStay">继续填写</button><button class="bk-ok" id="bkGo">继续返回</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- 场景：激活流程（act） / 配置模块（cfg），由首页入口写入 ----------
var INIT_CFG = (function () { try { var q = new URLSearchParams(location.search).get('mode'); if (q) sessionStorage.setItem('initMode', q); return sessionStorage.getItem('initMode') === 'cfg'; } catch (e) { return false; } })();
var HOME_URL = INIT_CFG ? 'home.html?act=1' : 'home.html';
if (INIT_CFG) {
  document.querySelectorAll('.step').forEach(function (s) { var n = s.querySelector('.num'); if (n && n.textContent.trim() === '6') s.lastChild.textContent = '重启服务'; });
  document.title = document.title.replace('· 初始化 ·', '· 配置 ·').replace('系统初始化', '重启服务');
  var _h1 = document.querySelector('.titlebar h1'); if (_h1) _h1.textContent = '配置';
}

// PRD 标注里的字段表格：字段名称 / 默认值 / 限制 / 作用 / 若未填提示
function tbl(rows) {
  return '<table><tr><th>字段名称</th><th>默认值</th><th>限制</th><th>作用</th><th>若未填提示</th></tr>' +
    rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
}
var ACCESS = 'http://192.168.1.100';          // 第一步填写的访问地址（演示值）
var HOST = ACCESS.replace(/^https?:\/\//, ''); // 本机 IP
var AI_URL = 'https://dev.zhimouyun.com/', AI_ACC = 'admin', AI_PWD = '123456'; // 内置AI服务默认值（演示值，待确认）
var ODM_URL = 'http://' + HOST + ':8000', ODM_ACC = 'admin', ODM_PWD = '12345678'; // 内置建图服务默认值（待确认）
// 演示授权码对应的额度：并发数 / 算法数量 / 二维建图 / 三维建模 / AI比对
var CODES = {
  MYUWVYTV: { conc: 4, algo: 12, m2d: 50, m3d: 0, cmp: 1000 },
  LMALL888: { conc: 8, algo: 30, m2d: 200, m3d: 100, cmp: 5000 },
  LMZERO00: { conc: 0, algo: 0, m2d: 0, m3d: 0, cmp: 0 }
};
var ALGOS = ['人员识别', '车辆识别', '烟火识别', '垃圾堆放', '占道经营', '河道漂浮物', '违章建筑', '人员聚集', '非机动车识别', '船只识别', '游泳识别', '秸秆焚烧'];
var NOTES = {
  code: { title: '云端资源授权码', items: [
    { cls: 'rule', tag: '字段', ver: 'B1.3.0', html: tbl([['云端资源授权码', '空', '文本框，最长 32 位；需联网验证', '开通靓马云端服务（AI识别、二维建图、三维建模、AI比对）的额度凭证', '请填写云端资源授权码']]) },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '本步骤可不填写授权码、不启用任何服务，直接进入下一步。<br>验证成功后输入框置灰不可编辑，右侧出现「替换授权码」按钮；点击后输入框清空并恢复可编辑，<b>下方额度模块内容一并清空</b>，已选的靓马云端服务取消选择，重新出现「验证授权码」按钮，需重新验证新授权码。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '<b>未验证授权码</b>（输入框为空，或已填写但未验证成功）时：下方 AI识别、二维建图、三维建模、AI比对四个模块中的「靓马云端服务」<b>全部置灰不可选择</b>，点击提示「请先验证云端资源授权码」；内置 / 独立服务不受影响。替换授权码后同样恢复为该状态。' }
  ]},
  verify: { title: '验证授权码', items: [
    { cls: 'rule', tag: '后端', ver: 'B1.3.0', html: '<b>授权码来源</b>：云端资源授权码在<b>翼飞平台</b>的「云端资源授权码」中生成和获取。<br><b>验证流程</b>：用户填写后点击「验证授权码」，后端把授权码发送到翼飞平台校验，翼飞平台返回该授权码的状态和额度。<br><b>返回状态</b>需包含三项：<br>· 是否存在<br>· 是否有效（未被禁用）<br>· 是否已被占用（已被其他设备使用）<br><b>判定</b>：存在、有效且未被占用 → 验证成功，展示额度；不存在、已禁用、已被占用中任一情况 → 统一提示「您的云端资源授权码不正确」，前端不区分具体原因。' },
    { cls: 'rule', tag: '规则', ver: 'B1.3.0', html: '输入框为空时按钮置灰不可点；输入内容后按钮变为蓝色，支持点击验证。<br>· <b>验证成功</b>：按钮消失，下方展示授权码额度及提示「若是需要增加额度，可联系商务或者官方客服增加。」；并按额度自动启用对应模块（见标注 3）。<br>· <b>验证失败</b>：输入框标红，统一提示「您的云端资源授权码不正确」，<b>不区分、不展示具体失败原因</b>。<br>· <b>无网环境</b>：点击验证时先判断网络，无网则不发起验证，输入框下方红字提示「您当前是无网环境，无法进行云端资源授权码验证」。' }
  ]},

  var ok = true;
  fieldsOf(k, S[k].mode).forEach(function (f) {
    var el = $('f-' + k + '-' + f.id); if (!el || f.ro) return;
    var bad = !el.value.trim();
    el.classList.toggle('bad', bad); el.nextElementSibling.textContent = bad ? '请填写' + f.label : '';
    if (bad) ok = false;
  });
  return ok;
}
function checkMod(k) {
  var s = S[k], d = DEF[k];
  if (!s.on) return true;
  if (!s.mode) { $('opts-' + k).classList.add('bad'); $('merr-' + k).textContent = '请选择' + d.name + '的部署方式'; return false; }
  var ok = checkFields(k);
  if (d.nodes && s.mode === 'indep' && !s.nodes) { if (ok) toast('请先获取' + d.name + '的节点信息', true); return false; }
  if (d.nodes && s.nodes && !s.nodes.every(function (n, i) { return s.ev[i]; })) { $('ntbl-' + k).classList.add('bad'); $('nerr-' + k).textContent = '请选择节点的事件类型'; ok = false; }
  return ok;
}
$('btnPrev').onclick = function () { location.href = 'activate-step4-project.html'; };

// ---------- 演示：必填验证开关（开=校验，关=不校验直接下一步），各步骤共用 ----------
function valOn() { try { return sessionStorage.getItem('demoVal') !== '0'; } catch (e) { return true; } }
function initValSw(onChange) {
  var sw = document.getElementById('swVal');
  sw.classList.toggle('off', !valOn());
  sw.onclick = function () {
    var on = this.classList.toggle('off') === false;
    try { sessionStorage.setItem('demoVal', on ? '1' : '0'); } catch (e) {}
    if (onChange) onChange(on);
    toast(on ? '必填验证已开启：点「下一步」会校验所有输入' : '必填验证已关闭：点「下一步」直接进入下一步');
  };
  if (onChange) onChange(valOn(), true);
}
initValSw();
$('btnNext').onclick = function () {
  var ok = true;
  if (valOn()) ORDER.forEach(function (k) { if (!checkMod(k)) ok = false; });
  if (!ok) { var b = document.querySelector('#mods .bad'); if (b) b.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  // 独立服务接口检测（演示：由右下角「独立服务接口」控制结果）
  var API_ERR = { ai: '访问AI识别服务接口异常', m2d: '访问二维建图服务接口异常', m3d: '访问三维建模服务接口异常', cmp: '访问AI比对服务接口异常' };
  var fail = $('selApi').value;
  var bad = ORDER.filter(function (k) { return S[k].on && S[k].mode === 'indep' && (fail === 'all' || fail === k); });
  ORDER.forEach(function (k) { var e = $('merr-' + k); if (e && e.dataset.api) { e.textContent = ''; delete e.dataset.api; } });
  if (bad.length) {
    bad.forEach(function (k) { var e = $('merr-' + k); if (e) { e.textContent = API_ERR[k]; e.dataset.api = '1'; } });
    modal('提示', bad.map(function (k) { return API_ERR[k]; }).join('<br>') + '<br><span style="color:#999">请检查服务器地址、账号、密码是否正确，以及服务是否已启动</span>');
    var el = $('opts-' + bad[0]); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  location.href = 'activate-step6-init.html';
};
// ---------- PRD 标注弹层 ----------
var curDot = null;
function closePop() { $('pop').classList.remove('show'); if (curDot) curDot.classList.remove('open'); curDot = null; }
function openPop(btn) {
  var n = NOTES[btn.dataset.note]; if (!n) return;
  closePop(); curDot = btn; btn.classList.add('open');
  $('popT').textContent = btn.textContent + '. ' + n.title;
  $('popB').innerHTML = n.items.map(function (it) {
    return '<div class="note ' + it.cls + '"><span class="ver">' + it.ver + '</span><span class="tag">' + it.tag + '</span>' + it.html + '</div>';
  }).join('');
  var pop = $('pop'); pop.classList.add('show');
  var r = btn.getBoundingClientRect(), sx = window.scrollX, sy = window.scrollY;
  var vw = document.documentElement.clientWidth;
  var left = r.right + sx + 10;
  if (left + pop.offsetWidth > sx + vw - 12) left = Math.max(sx + 12, r.left + sx - pop.offsetWidth - 10);
  pop.style.left = left + 'px'; pop.style.top = (r.top + sy) + 'px';
}
// 模块是动态渲染的，标注点用事件委托
document.addEventListener('click', function (e) {
  var d = e.target.closest('.dot');
  if (d) { e.stopPropagation(); curDot === d ? closePop() : openPop(d); return; }
  if (!e.target.closest('#pop')) closePop();
}, true);
$('popX').onclick = closePop;
$('swDots').onclick = function () { this.classList.toggle('off'); document.body.classList.toggle('hide-dots', this.classList.contains('off')); closePop(); };
$('mask').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

renderMods();

// ---------- 返回确认：不保存，返回首页 ----------
function openBack() { document.getElementById('bkMask').classList.add('open'); }
function closeBack() { document.getElementById('bkMask').classList.remove('open'); }
document.getElementById('bkX').onclick = document.getElementById('bkStay').onclick = closeBack;
document.getElementById('bkGo').onclick = function () { closeBack(); location.href = HOME_URL; };
</script>
