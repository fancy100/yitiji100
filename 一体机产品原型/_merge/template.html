<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif; color: #1f2329; background: #f5f6f8; display: flex; height: 100vh; }
  aside { width: 300px; background: #fff; border-right: 1px solid #e5e6eb; overflow-y: auto; flex-shrink: 0; }
  aside h1 { font-size: 16px; margin: 0; padding: 16px; border-bottom: 1px solid #e5e6eb; }
  .search { margin: 12px 16px; width: calc(100% - 32px); padding: 6px 10px; border: 1px solid #c9cdd4; border-radius: 4px; }
  .mod { padding: 8px 16px 4px; font-weight: bold; color: #4e5969; font-size: 13px; }
  .pg { padding: 6px 16px 6px 28px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .pg:hover { background: #f2f3f5; }
  .pg.active { background: #e8f3ff; color: #165dff; }
  .pg small { color: #86909c; white-space: nowrap; }
  main { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { padding: 2px 10px; border-radius: 12px; border: 1px solid #c9cdd4; cursor: pointer; user-select: none; font-size: 12px; }
  .chip.off { opacity: .35; }
  .ver { background: #fff; border-radius: 6px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .ver.old { opacity: .75; }
  .ver h3 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 12px; align-items: center; }
  .tag { font-size: 12px; padding: 0 8px; border-radius: 3px; background: #165dff; color: #fff; font-weight: normal; }
  .tag.gray { background: #c9cdd4; color: #1f2329; }
  .meta { color: #86909c; font-size: 12px; margin-bottom: 12px; }
  .meta a { color: #165dff; }
  .item { padding: 8px 12px; margin: 6px 0; border-radius: 4px; white-space: pre-wrap; border-left: 4px solid transparent; }
  .item .lbl { display: inline-block; font-size: 11px; color: #4e5969; margin-bottom: 2px; }
  .item.ui { background: #fafafa; border-left-color: #e5e6eb; color: #4e5969; }
  .empty { color: #86909c; padding: 40px; text-align: center; }
  .toggle { margin-left: auto; font-size: 12px; color: #165dff; cursor: pointer; font-weight: normal; }
</style>
</head>
<body>
<aside>
  <h1>__TITLE__</h1>
  <input class="search" id="search" placeholder="搜索页面或内容">
  <div id="nav"></div>
</aside>
<main>
  <div class="filters" id="filters"></div>
  <div id="content"><div class="empty">从左侧选择一个页面</div></div>
</main>
<script>
const DB = __DATA__;
const catMap = Object.fromEntries(DB.cats.map(c => [c.key, c]));
const state = { mod: null, page: null, q: '', off: new Set(), showHistory: false };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const verLabel = v => v.split('-').slice(1).join('-');

function pageText(p) { return p.name + ' ' + p.history.map(h => h.items.map(i => i.text).join(' ')).join(' '); }

function renderNav() {
  const q = state.q.trim();
  let html = '';
  DB.data.forEach((m, mi) => {
    const pages = m.pages.map((p, pi) => ({ p, pi })).filter(x => !q || pageText(x.p).includes(q));
    if (!pages.length) return;
    html += '<div class="mod">' + esc(m.id + ' ' + m.name) + '</div>';
    pages.forEach(({ p, pi }) => {
      const act = state.mod === mi && state.page === pi ? ' active' : '';
      html += '<div class="pg' + act + '" data-m="' + mi + '" data-p="' + pi + '"><span>' + esc(p.name) +
        '</span><small>' + esc(verLabel(p.latest)) + '</small></div>';
    });
  });
  document.getElementById('nav').innerHTML = html || '<div class="empty">无匹配结果</div>';
}

function renderFilters() {
  const all = [{ key: 'ui', label: '界面文字', color: '#fafafa' }].concat(DB.cats);
  document.getElementById('filters').innerHTML = all.map(c =>
    '<span class="chip' + (state.off.has(c.key) ? ' off' : '') + '" data-k="' + c.key +
    '" style="background:' + c.color + '">' + esc(c.label) + '</span>').join('');
}

function renderItem(it) {
  const k = it.cat || 'ui';
  if (state.off.has(k)) return '';
  if (!it.cat) return '<div class="item ui">' + esc(it.text) + '</div>';
  const c = catMap[it.cat];
  if (!c) return '';
  return '<div class="item" style="background:' + c.color + '33;border-left-color:' + c.color + '">' +
    '<span class="lbl">' + esc(c.label) + '</span>\n' + esc(it.text) + '</div>';
}

function renderContent() {
  if (state.mod === null) return;
  const m = DB.data[state.mod], p = m.pages[state.page];
  const list = state.showHistory ? p.history : p.history.slice(0, 1);
  let html = '';
  list.forEach((h, i) => {
    const body = h.items.map(renderItem).join('');
    html += '<div class="ver' + (i ? ' old' : '') + '"><h3>' + esc(p.name) +
      '<span class="tag' + (i ? ' gray' : '') + '">' + esc(verLabel(h.ver)) + (i ? ' 历史' : ' 最新') + '</span>' +
      (i === 0 && p.history.length > 1 ? '<span class="toggle" id="tgl">' +
        (state.showHistory ? '只看最新' : '查看历史版本（' + (p.history.length - 1) + '）') + '</span>' : '') +
      '</h3><div class="meta">' + esc(m.id + ' ' + m.name) + (h.chain ? ' · ' + esc(h.chain) : '') +
      ' · <a href="' + encodeURI(h.url) + '" target="_blank">打开原始 Axure 页面</a></div>' +
      (body || '<div class="empty">该版本此页无文字内容（可能只有图片或流程图，请打开原始页面查看）</div>') + '</div>';
  });
  document.getElementById('content').innerHTML = html;
}

document.getElementById('nav').addEventListener('click', e => {
  const el = e.target.closest('.pg');
  if (!el) return;
  state.mod = +el.dataset.m; state.page = +el.dataset.p; state.showHistory = false;
  renderNav(); renderContent();
});
document.getElementById('filters').addEventListener('click', e => {
  const el = e.target.closest('.chip');
  if (!el) return;
  const k = el.dataset.k;
  state.off.has(k) ? state.off.delete(k) : state.off.add(k);
  renderFilters(); renderContent();
});
document.getElementById('content').addEventListener('click', e => {
  if (e.target.id === 'tgl') { state.showHistory = !state.showHistory; renderContent(); }
});
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value; renderNav(); });

renderNav(); renderFilters();
</script>
</body>
</html>
