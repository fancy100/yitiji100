const catMap = Object.fromEntries(DB.cats.map(c => [c.key, c]));
const state = { mod: null, page: null, q: '', off: new Set(), showHistory: false };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const verLabel = v => v.split('-').slice(1).join('-');

function pageText(p) { return p.name + ' ' + p.history.map(h => h.items.map(i => i.text).join(' ')).join(' '); }

function renderNav() {
  const q = state.q.trim();
  let html = '';
  DB.data.forEach((m, mi) => {
    const pages = m.pages.map((p, pi) => ({ p, pi })).filter(x => !q || pageText(x.p).includes(q));
    if (!pages.length) return;
    html += '<div class="mod">' + esc(m.id + ' ' + m.name) + '</div>';
    pages.forEach(({ p, pi }) => {
      const act = state.mod === mi && state.page === pi ? ' active' : '';
      html += '<div class="pg' + act + '" data-m="' + mi + '" data-p="' + pi + '"><span>' + esc(p.name) +
        '</span><small>' + esc(verLabel(p.latest)) + '</small></div>';
    });
  });
  document.getElementById('nav').innerHTML = html || '<div class="empty">无匹配结果</div>';
}

function renderFilters() {
  const all = [{ key: 'ui', label: '界面文字', color: '#fafafa' }].concat(DB.cats);
  document.getElementById('filters').innerHTML = all.map(c =>
    '<span class="chip' + (state.off.has(c.key) ? ' off' : '') + '" data-k="' + c.key +
    '" style="background:' + c.color + '">' + esc(c.label) + '</span>').join('');
}

function renderItem(it) {
  const k = it.cat || 'ui';
  if (state.off.has(k)) return '';
  if (!it.cat) return '<div class="item ui">' + esc(it.text) + '</div>';
  const c = catMap[it.cat];
  if (!c) return '';
  return '<div class="item" style="background:' + c.color + '33;border-left-color:' + c.color + '">' +
    '<span class="lbl">' + esc(c.label) + '</span>\n' + esc(it.text) + '</div>';
}

function renderContent() {
  if (state.mod === null) return;
  const m = DB.data[state.mod], p = m.pages[state.page];
  const list = state.showHistory ? p.history : p.history.slice(0, 1);
  let html = '';
  list.forEach((h, i) => {
    const body = h.items.map(renderItem).join('');
    html += '<div class="ver' + (i ? ' old' : '') + '"><h3>' + esc(p.name) +
      '<span class="tag' + (i ? ' gray' : '') + '">' + esc(verLabel(h.ver)) + (i ? ' 历史' : ' 最新') + '</span>' +
      (i === 0 && p.history.length > 1 ? '<span class="toggle" id="tgl">' +
        (state.showHistory ? '只看最新' : '查看历史版本（' + (p.history.length - 1) + '）') + '</span>' : '') +
      '</h3><div class="meta">' + esc(m.id + ' ' + m.name) + (h.chain ? ' · ' + esc(h.chain) : '') +
      ' · <a href="' + encodeURI(h.url) + '" target="_blank">打开原始 Axure 页面</a></div>' +
      (body || '<div class="empty">该版本此页无文字内容（可能只有图片或流程图，请打开原始页面查看）</div>') + '</div>';
  });
  document.getElementById('content').innerHTML = html;
}

document.getElementById('nav').addEventListener('click', e => {
  const el = e.target.closest('.pg');
  if (!el) return;
  state.mod = +el.dataset.m; state.page = +el.dataset.p; state.showHistory = false;
  renderNav(); renderContent();
});
document.getElementById('filters').addEventListener('click', e => {
  const el = e.target.closest('.chip');
  if (!el) return;
  const k = el.dataset.k;
  state.off.has(k) ? state.off.delete(k) : state.off.add(k);
  renderFilters(); renderContent();
});
document.getElementById('content').addEventListener('click', e => {
  if (e.target.id === 'tgl') { state.showHistory = !state.showHistory; renderContent(); }
});
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value; renderNav(); });

renderNav(); renderFilters();
</script>
